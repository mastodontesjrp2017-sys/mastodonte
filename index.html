<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mastodonte Gestão</title>
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mastodonte">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#161513; --ink2:#5d5850; --ink3:#8d877c; --line:#e3ddd0;
  --brand:#141414; --brand-ink:#f0eadc; --accent:#b8742a; --accent-soft:#f3e4cf;
  --ok:#2f7a4c; --ok-soft:#e1f0e5; --warn:#a87a06; --warn-soft:#f8edc8; --bad:#b8352a; --bad-soft:#f8dfdb;
  --mute-soft:#ebe7de; --shadow:0 1px 2px rgba(20,18,14,.06),0 4px 14px rgba(20,18,14,.06);
  --r:14px; --slab:"Zilla Slab",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --card:#1c1b19; --ink:#efeae0; --ink2:#bdb6a8; --ink3:#8a8478; --line:#2e2c28;
  --brand:#0a0a0a; --brand-ink:#f0eadc; --accent:#d8964b; --accent-soft:#3a2b1a;
  --ok:#5cbf83; --ok-soft:#173222; --warn:#e2b53c; --warn-soft:#3a3013; --bad:#ec6f62; --bad-soft:#3d1b17;
  --mute-soft:#26241f; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1c1b19; --ink:#efeae0; --ink2:#bdb6a8; --ink3:#8a8478; --line:#2e2c28;
  --brand:#0a0a0a; --brand-ink:#f0eadc; --accent:#d8964b; --accent-soft:#3a2b1a;
  --ok:#5cbf83; --ok-soft:#173222; --warn:#e2b53c; --warn-soft:#3a3013; --bad:#ec6f62; --bad-soft:#3d1b17;
  --mute-soft:#26241f; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--slab);margin:0;letter-spacing:.2px}
.hide{display:none!important}
/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{height:30px}
.top .tt{flex:1;min-width:0}
.top .tt b{font-family:var(--slab);font-size:18px;letter-spacing:1px;display:block;line-height:1}
.top .tt small{opacity:.65;font-size:12px}
.iconbtn{background:transparent;border:0;color:inherit;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.12)}
.iconbtn svg{width:22px;height:22px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:7px 16px;text-align:center;font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px 16px}
/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--ink3);padding:4px 0;cursor:pointer;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
/* ---------- elementos ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:12px 14px}
.kpi small{display:block;color:var(--ink2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-family:var(--slab);font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.bad{background:var(--bad-soft);border-color:transparent}.kpi.bad b{color:var(--bad)}
.kpi.ok b{color:var(--ok)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec-h h2{font-size:19px}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.acc{background:var(--accent);color:#fff}
.btn.ghost{background:var(--mute-soft);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:18px;
  background:var(--accent);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
/* lista */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.li:first-child{border-top:0}
.li:active{background:var(--mute-soft)}
.li .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.li.st-atraso{background:linear-gradient(90deg,var(--bad-soft),transparent 70%)}
.li.st-atraso::before,.li.st-vence::before,.li.st-emdia::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.li.st-atraso::before{background:var(--bad)}.li.st-vence::before{background:var(--warn)}.li.st-emdia::before{background:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-atraso{background:var(--bad);color:#fff}.b-vence{background:var(--warn-soft);color:var(--warn)}
.b-emdia{background:var(--ok-soft);color:var(--ok)}.b-mute{background:var(--mute-soft);color:var(--ink2)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--mute-soft);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink2);flex:none}
.st-atraso .avatar{background:var(--bad);color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--ink3)}
.wa{width:36px;height:36px;border-radius:10px;background:#25d366;color:#fff;display:grid;place-items:center;flex:none;border:0;cursor:pointer;text-decoration:none}
.wa svg{width:20px;height:20px}
/* barras */
.bars .b{margin-top:10px}.bars .b:first-child{margin-top:0}
.bars .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bars .bt{height:8px;background:var(--mute-soft);border-radius:99px;overflow:hidden}
.bars .bf{height:100%;background:var(--accent);border-radius:99px}
/* formulário */
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font-size:16px}
.f textarea{min-height:70px;resize:vertical}
.f .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .g2 label{margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.seg{display:flex;background:var(--mute-soft);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:700;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,9,8,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;background:var(--line);border-radius:9px;margin:4px auto 12px}
.sheet h3{font-size:21px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:10px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw;text-align:center;font-size:14px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;background:var(--brand);color:var(--brand-ink)}
.login img{width:min(260px,70vw);margin-bottom:22px}
.login .card{width:100%;max-width:380px;color:var(--ink)}
.login h1{font-size:22px;margin-bottom:2px}
.login p{margin:0 0 6px;color:var(--ink2);font-size:13.5px}
.lnk{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0;font-size:14px}
/* importador */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--card)}
.drop b{display:block;font-family:var(--slab);font-size:18px;margin-bottom:4px}
.drop small{color:var(--ink3)}
.imp{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:11px 12px;border-top:1px solid var(--line);align-items:start}
.imp:first-child{border-top:0}
.imp input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.imp .top2{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.imp .d{font-size:12px;color:var(--ink3)}
.imp select{width:100%;margin-top:6px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.imp.dup{opacity:.45}
.imp.k-cpf{background:var(--ok-soft)}
.imp.k-sug{background:var(--warn-soft)}
.sug{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.priv .val{filter:blur(7px)}
.muted{color:var(--ink3);font-size:13px}
.tag{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.ev-date{width:52px;flex:none;text-align:center;border-radius:12px;background:var(--brand);color:var(--brand-ink);padding:6px 0}
.ev-date b{display:block;font-family:var(--slab);font-size:22px;line-height:1}
.ev-date small{font-size:11px;text-transform:uppercase;font-weight:700}
.task{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:20px;height:20px;accent-color:var(--ok)}
.task.done .grow{text-decoration:line-through;color:var(--ink3)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencher com os dados do projeto Supabase.
   Vazio = MODO DEMONSTRAÇÃO (dados ficam só no aparelho).
   ===================================================================== */
const CFG = { url: 'https://cknzysljezvpazonvibb.supabase.co', key: 'sb_publishable_ji48PdmWNR5nvQkXMhbbCQ_DEekbpVL' };
const VERSAO = 'v1';
const DEMO = !CFG.url || !CFG.key;
const sb = DEMO ? null : supabase.createClient(CFG.url, CFG.key);

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dig = s => String(s ?? '').replace(/\D/g, '');
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fdata = iso => { if (!iso) return ''; const [y,m,d] = iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; };
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const fmtDoc = d => { d = dig(d); if (d.length===11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  if (d.length===14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'); return d; };
const fmtTel = t => { t = dig(t); if (t.length===11) return t.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
  if (t.length===10) return t.replace(/(\d{2})(\d{4})(\d{4})/,'($1) $2-$3'); return t; };
function cpfOk(c){ c=dig(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  for (let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+= +c[i]*(t+1-i); if (((s*10)%11)%10 !== +c[t]) return false; } return true; }
function cnpjOk(c){ c=dig(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+= +c[i]*p--; if(p<2)p=9;} const r=s%11; return r<2?0:11-r; };
  return calc(12)===+c[12] && calc(13)===+c[13]; }
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function loadScript(src){ return new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error('Falha ao carregar '+src)); document.head.appendChild(s); }); }

const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.8 11.9 11.9 0 004.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2-.2-.2-.4-.3z"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>'
};

/* ---------------- banco de dados (Supabase ou local) ---------------- */
const TABELAS = ['afiliados','movimentos','eventos','evento_tarefas','usuarios'];
const Local = {
  db: null,
  load(){ if (this.db) return this.db;
    this.db = LS.get('masto_demo', null) || { seq:1, afiliados:[], movimentos:[], eventos:[], evento_tarefas:[],

const DB = {
  async all(t){
    if (DEMO) return JSON.parse(JSON.stringify(Local.load()[t]));
    const out=[]; const step=1000;
    for (let i=0;;i+=step){
      const { data, error } = await sb.from(t).select('*').order(t==='usuarios'?'email':'id').range(i, i+step-1);
      if (error) throw error; out.push(...data); if (data.length < step) break;
    }
    return out;
  },
  async ins(t, rows, ignorarDup=false){
    rows = Array.isArray(rows) ? rows : [rows];
    if (DEMO){ const db=Local.load(); const res=[];
      for (const r of rows){
        if (ignorarDup && r.chave && db[t].some(x=>x.chave===r.chave)) continue;
        const n = t==='usuarios' ? {...r} : {id: db.seq++, criado_em:new Date().toISOString(), ...r};
        db[t].push(n); res.push(n); }
      Local.save(); return res; }
    let res=[];
    for (let i=0;i<rows.length;i+=500){
      const part = rows.slice(i,i+500);
      const q = ignorarDup ? sb.from(t).upsert(part,{onConflict:'chave', ignoreDuplicates:true}).select()
                           : sb.from(t).insert(part).select();
      const { data, error } = await q; if (error) throw error; res = res.concat(data||[]);
    }
    return res;
  },
  async upd(t, match, patch){
    if (DEMO){ const db=Local.load(); const [k,v]=Object.entries(match)[0];
      db[t].forEach(x=>{ if (x[k]===v) Object.assign(x, patch); }); Local.save(); return; }
    const { error } = await sb.from(t).update(patch).match(match); if (error) throw error;
  },
  async del(t, match){
    if (DEMO){ const db=Local.load(); const [k,v]=Object.entries(match)[0];
      db[t] = db[t].filter(x=>x[k]!==v); Local.save(); return; }
    const { error } = await sb.from(t).delete().match(match); if (error) throw error;
  }
};

  if (/fetch|network/i.test(m)) return 'Sem conexão com o servidor. Tente de novo.';

/* ---------------- regra de mensalidade / atraso ---------------- */
// Soma tudo que o afiliado já pagou e compara com as competências vencidas desde o início.
// Pagamento maior que a mensalidade cobre os meses seguintes (e paga primeiro os mais antigos).
function statusAf(a, hoje = new Date()){
  const pago = S.movimentos.filter(m => m.afiliado_id === a.id && m.valor > 0).reduce((s,m)=>s+m.valor,0);
  if (!a.ativo) return {k:'inativo', txt:'Inativo', pago};
  const v = a.valor_mensal;
  if (!(v > 0)) return {k:'livre', txt:'Sem valor fixo', pago};
  const [y0,m0] = (a.inicio || hojeISO()).split('-').map(Number);
  const h0 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const venc = (y,m) => new Date(y, m-1, Math.min(a.dia_vencimento||10, new Date(y, m, 0).getDate()));
  let y=y0, m=m0, vencidas=0;
  while (y < hoje.getFullYear() || (y===hoje.getFullYear() && m <= hoje.getMonth()+1)) {
    if (venc(y,m) < h0) vencidas++;
    m++; if (m>12){m=1;y++;}
  }
  const cobertos = Math.floor((pago + 0.005) / v);
  const compN = n => { const t = (m0-1) + n; return {y: y0 + Math.floor(t/12), m: (t%12)+1}; };
  const pagoAte = cobertos > 0 ? compN(cobertos-1) : null;
  const deve = vencidas*v - pago;
  if (deve > 0.005) {
    const meses = Math.ceil(deve / v - 1e-9);
    return {k:'atraso', txt: meses===1 ? '1 mês em atraso' : `${meses} meses em atraso`, meses, deve, pago, pagoAte};
  }
  const prox = compN(cobertos); const dv = venc(prox.y, prox.m);
  const dias = Math.round((dv - h0) / 864e5);
  if (dias <= 5) return {k:'vence', txt: dias<=0 ? 'Vence hoje' : `Vence em ${dias} dia${dias>1?'s':''}`, pago, pagoAte, prox:dv};
  return {k:'emdia', txt:'Em dia', pago, pagoAte, prox:dv};
}
const compTxt = c => c ? `${MESES[c.m-1]}/${c.y}` : '—';
const BADGE = {atraso:'b-atraso', vence:'b-vence', emdia:'b-emdia', inativo:'b-mute', livre:'b-mute'};

function waLink(a, st){
  let tel = dig(a.telefone); if (!tel) return null; if (tel.length <= 11) tel = '55' + tel;
  const nome = (a.nome||'').split(' ')[0];
  const msg = st && st.k==='atraso'
    ? `Olá ${nome}, tudo bem? Aqui é da Associação Mastodonte. Consta em aberto ${st.meses} mensalidade${st.meses>1?'s':''}, total de ${brl(st.deve)}. Se já pagou, desconsidere. Obrigado pelo apoio! 🦣`
    : `Olá ${nome}, tudo bem? Aqui é da Associação Mastodonte.`;
  return `https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;
}

const CAT_ENT = ['Mensalidade','Boletos (sem identificação)','Eventos / vendas','Doação avulsa','Cartão (maquininha)','Rendimentos','Outras entradas'];
const CAT_SAI = ['Tarifas bancárias','Contas (luz/água/internet)','Compras / mercado','Combustível','Eventos','Serviços / pessoas','Equipamentos','Aluguel / imóvel','Outras saídas'];
function catAuto(desc, nome, valor){
  const t = norm(desc + ' ' + (nome||''));
  if (valor > 0) {
    if (/RENDIMENTO/.test(t)) return 'Rendimentos';
    if (/REDECARD|RECEBIMENTO REDE|\bREDE\b/.test(t)) return 'Cartão (maquininha)';
    if (/BOLETO/.test(t)) return 'Boletos (sem identificação)';
    return 'Outras entradas';
  }
  if (/\bTAR\b|TARIFA|CUSTAS|SISDEB/.test(t)) return 'Tarifas bancárias';
  if (/CPFL|SAERP|ALARES|CONCESSIONARIA|SABESP|ENERGIA|TELEFON|INTERNET/.test(t)) return 'Contas (luz/água/internet)';
  if (/SUPERMERC|MERCADO|MERCEARIA|ATACA|EMPORIO|ARMAZEM|SALGADOS|BUFFET|PADARIA|ACOUGUE/.test(t)) return 'Compras / mercado';
  if (/PETRO|POSTO|COMBUST|AUTO POSTO/.test(t)) return 'Combustível';
  if (/IMOVEIS|ALUGUEL/.test(t)) return 'Aluguel / imóvel';
  return 'Outras saídas';
}

      <p>${modo==='entrar'?'Use o e-mail liberado pelo administrador.':modo==='criar'?'Seu e-mail precisa estar liberado pelo administrador. Crie sua senha.':'Enviaremos um link para criar uma nova senha.'}</p>

      </form>
      <div class="row" style="justify-content:space-between;margin-top:8px">

          `<button class="lnk" onclick="telaLogin('criar')">Primeiro acesso</button><button class="lnk" onclick="telaLogin('rec')">Esqueci a senha</button>`}
      </div>`}
    </div>
    <small style="opacity:.5;margin-top:18px">Mastodonte Gestão ${VERSAO}</small>
  </div>`;
  if (DEMO) return;

        if (error) throw new Error(/permiss|Database error/i.test(error.message) ? 'Esse e-mail não está liberado. Peça ao administrador.' : error.message);

      } else {

    <div><label>Situação</label><select name="ativo"><option value="1" ${a.ativo?'selected':''}>Ativo</option><option value="0" ${!a.ativo?'selected':''}>Inativo</option></select></div></div>
    <label>Observações</label><textarea name="obs">${esc(a.obs)}</textarea>
    <div class="err" id="afErr"></div>
    <div class="row" style="margin-top:8px">
      ${id?`<button type="button" class="btn danger" onclick="excluirAf(${id})">Excluir</button>`:''}
      <button type="button" class="btn ghost grow" onclick="fecharSheet()">Cancelar</button>
      <button class="btn acc grow" type="submit">Salvar</button></div>
  </form>`);
  $('#fAf').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = new FormData(ev.target);
    const doc = dig(f.get('cpf'));
    if (doc && !(doc.length===11 ? cpfOk(doc) : doc.length===14 ? cnpjOk(doc) : false)) return $('#afErr').textContent = 'CPF/CNPJ inválido — confira os números.';
    const valor = parseFloat(String(f.get('valor_mensal')).replace(/\./g,'').replace(',','.'));
    if (!(valor >= 0)) return $('#afErr').textContent = 'Informe o valor da doação.';
    const row = { nome: f.get('nome').trim(), cpf: doc || null, telefone: dig(f.get('telefone')) || null, endereco: f.get('endereco').trim() || null,
      valor_mensal: valor, dia_vencimento: Math.min(31, Math.max(1, +f.get('dia_vencimento')||10)),
      inicio: (f.get('inicio') || hojeISO().slice(0,7)) + '-01', ativo: f.get('ativo')==='1', obs: f.get('obs').trim() || null };
    if (doc && S.afiliados.some(x => x.id!==id && dig(x.cpf)===doc)) return $('#afErr').textContent = 'Já existe afiliado com esse CPF/CNPJ.';
    try {
      let novoId = id;
      if (id) await DB.upd('afiliados', {id}, row); else novoId = (await DB.ins('afiliados', row))[0]?.id;
      // vincula automaticamente entradas do extrato com o mesmo CPF que ainda não têm dono
      let vinc = 0;
      if (doc && novoId){
        const alvo = S.movimentos.filter(m => m.valor>0 && !m.afiliado_id && dig(m.documento)===doc);
        for (const m of alvo){ await DB.upd('movimentos', {id:m.id}, {afiliado_id:novoId, categoria:'Mensalidade'}); vinc++; }
      }
      await carregar('afiliados','movimentos'); fecharSheet();
      if (S.imp) { reclassificarImp(); }
      toast(id ? 'Afiliado atualizado' : 'Afiliado cadastrado' + (vinc ? ` · ${vinc} pagamento(s) do extrato vinculados` : ''));
      render();
    } catch(e){ $('#afErr').textContent = erroMsg(e); }
  });
}

/* =====================================================================
   FINANCEIRO
   ===================================================================== */
function vFinanceiro(){
  const mes = S.mesFin;
  const doMes = S.movimentos.filter(m=>m.valor && (mes==='tudo' || m.data.startsWith(mes)));
  const ent = doMes.filter(m=>m.valor>0), sai = doMes.filter(m=>m.valor<0);
  const tE = ent.reduce((s,m)=>s+m.valor,0), tS = sai.reduce((s,m)=>s-m.valor,0);
  const naoid = S.movimentos.filter(m=>m.valor>0 && !m.afiliado_id && (mes==='tudo'||m.data.startsWith(mes)) && m.categoria==='Boletos (sem identificação)');
  const lst = S.tipoFin==='entrada' ? ent : S.tipoFin==='naoid' ? naoid : sai;
  const porCat = {}; lst.forEach(m=>{ const c=m.categoria||'Sem categoria'; porCat[c]=(porCat[c]||0)+Math.abs(m.valor); });
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]); const mx = cats[0]?.[1]||1;
  const meses = [...new Set(S.movimentos.map(m=>m.data.slice(0,7)).concat(hojeISO().slice(0,7)))].sort().reverse();
  $('#view').innerHTML = `
    <div class="row"><select class="search grow" onchange="S.mesFin=this.value;vFinanceiro()">
      <option value="tudo" ${mes==='tudo'?'selected':''}>Todo o período</option>
      ${meses.map(m=>`<option value="${m}" ${m===mes?'selected':''}>${MESES_L[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')}
    </select></div>
    <div class="kpis" style="margin-top:10px">
      <div class="card kpi ok"><small>Entradas</small><b class="val">${brl(tE)}</b></div>
      <div class="card kpi"><small>Saídas</small><b class="val neg">${brl(tS)}</b></div>
      <div class="card kpi"><small>Resultado</small><b class="val ${tE-tS>=0?'pos':'neg'}">${brl(tE-tS)}</b></div>
      <div class="card kpi"><small>Mensalidades</small><b class="val">${brl(ent.filter(m=>m.afiliado_id).reduce((s,m)=>s+m.valor,0))}</b></div>
    </div>
    <div class="seg" style="margin-top:14px">
      <button class="${S.tipoFin==='saida'?'on':''}" onclick="S.tipoFin='saida';vFinanceiro()">Saídas</button>
      <button class="${S.tipoFin==='entrada'?'on':''}" onclick="S.tipoFin='entrada';vFinanceiro()">Entradas</button>
      <button class="${S.tipoFin==='naoid'?'on':''}" onclick="S.tipoFin='naoid';vFinanceiro()">Boletos s/ dono${naoid.length?` (${naoid.length})`:''}</button>
    </div>
    ${cats.length && S.tipoFin!=='naoid' ? `<div class="card bars" style="margin-top:12px">${cats.map(([c,v])=>`<div class="b"><div class="bl"><span>${esc(c)}</span><b class="val">${brl(v)}</b></div><div class="bt"><div class="bf" style="width:${(v/mx*100).toFixed(1)}%;${S.tipoFin==='saida'?'background:var(--bad)':'background:var(--ok)'}"></div></div></div>`).join('')}</div>` : ''}
    ${S.tipoFin==='naoid' ? `<p class="muted" style="margin:12px 2px 0">O banco junta os boletos do dia numa linha só. Toque num boleto e distribua entre os afiliados que pagaram (o relatório de cobrança do banco mostra quem foi).</p>` : ''}
    <div style="margin-top:12px">${lst.length ? `<div class="list">${lst.sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id).map(linhaMov).join('')}</div>` : '<div class="card empty">Nada nesse período.</div>'}</div>`;
  fab('formMov()');
}
function linhaMov(m){
  const af = m.afiliado_id && S.afiliados.find(a=>a.id===m.afiliado_id);
  const ev = m.evento_id && S.eventos.find(e=>e.id===m.evento_id);
  return `<div class="li" onclick="formMov(${m.id})"><div class="grow">
    <div class="t">${esc(af ? af.nome : (m.nome || m.descricao))}</div>
    <div class="s">${fdata(m.data)} · ${esc(af ? 'Mensalidade' : m.categoria || '—')}${ev?' · '+esc(ev.nome):''}${m.nome?' · '+esc(m.descricao):''}</div></div>
    <div class="v val ${m.valor>0?'pos':'neg'}">${brl(m.valor)}</div></div>`;
}
function formMov(id, pre={}){
  const m = id ? S.movimentos.find(x=>x.id===id) : {data:hojeISO(), valor: S.tipoFin==='entrada'?1:-1, ...pre};

  <form class="f" id="fMov">
    <div class="seg" style="margin-top:6px" id="segT">
      <button type="button" data-t="saida" class="${tipo==='saida'?'on':''}" ${id&&m.origem==='extrato'?'disabled':''}>Saída</button>
      <button type="button" data-t="entrada" class="${tipo==='entrada'?'on':''}" ${id&&m.origem==='extrato'?'disabled':''}>Entrada</button></div>
    <input type="hidden" name="tipo" value="${tipo}">
    <div class="g2"><div><label>Data</label><input name="data" type="date" value="${m.data}" required ${m.origem==='extrato'?'readonly':''}></div>
    <div><label>Valor</label><input name="valor" inputmode="decimal" required value="${id||pre.valor?String(Math.abs(m.valor)).replace('.',','):''}" ${m.origem==='extrato'?'readonly':''}></div></div>
    <label>Descrição</label><input name="descricao" required value="${esc(m.origem==='extrato' ? (m.nome||m.descricao) : m.descricao)}" ${m.origem==='extrato'?'readonly':''}>
    <label>Categoria</label><select name="categoria" id="mCat"></select>
    <div id="mAfBox"><label>Mensalidade de (afiliado)</label><select name="afiliado_id"><option value="">— nenhum —</option>${opsAf.map(a=>`<option value="${a.id}" ${a.id===m.afiliado_id?'selected':''}>${esc(a.nome)}</option>`).join('')}</select></div>
    <label>Evento</label><select name="evento_id"><option value="">— nenhum —</option>${S.eventos.map(e=>`<option value="${e.id}" ${e.id===m.evento_id?'selected':''}>${esc(e.nome)}${e.data?' ('+fdata(e.data)+')':''}</option>`).join('')}</select>
    <div class="err" id="mErr"></div>
    ${id && m.valor>0 && !m.afiliado_id ? `<button type="button" class="btn ghost wide" style="margin-top:8px" onclick="distribuir(${id})">Dar baixa em afiliados (dividir valor)</button>`:''}
    <div class="row" style="margin-top:8px">
      ${id?`<button type="button" class="btn danger" onclick="excluirMov(${id})">Excluir</button>`:''}
      <button type="button" class="btn ghost grow" onclick="fecharSheet()">Cancelar</button><button class="btn acc grow">Salvar</button></div>
  </form>`);
  const setTipo = t => { $('#fMov [name=tipo]').value=t; $('#segT').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
    const cs = t==='entrada'?CAT_ENT:CAT_SAI; const cur = m.categoria;
    $('#mCat').innerHTML = cs.concat(cur && !cs.includes(cur)?[cur]:[]).map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
    $('#mAfBox').classList.toggle('hide', t!=='entrada'); };
  $('#segT').querySelectorAll('button').forEach(b=>b.onclick=()=>setTipo(b.dataset.t));
  setTipo(tipo);
  $('#fMov [name=afiliado_id]').onchange = e => { if (e.target.value) $('#mCat').value = 'Mensalidade'; };
  $('#fMov').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = new FormData(ev.target); const t = f.get('tipo');

    if (!(v>0)) return $('#mErr').textContent='Valor inválido.';
    const afId = t==='entrada' && f.get('afiliado_id') ? +f.get('afiliado_id') : null;
    const row = { categoria: afId ? 'Mensalidade' : f.get('categoria'), afiliado_id: afId, evento_id: f.get('evento_id') ? +f.get('evento_id') : null };
    if (m.origem!=='extrato') Object.assign(row, { data: f.get('data'), valor: t==='entrada'? v : -v, descricao: f.get('descricao').trim() });
    try { if (id) await DB.upd('movimentos',{id},row); else await DB.ins('movimentos',{...row, origem:'manual'});
      await carregar('movimentos'); fecharSheet(); toast('Salvo'); render(); } catch(e){ $('#mErr').textContent=erroMsg(e); }
  });
}
async function excluirMov(id){
  const m = S.movimentos.find(x=>x.id===id);
  if (!confirm(m.origem==='extrato' ? 'Excluir esse lançamento do extrato? Se importar o mesmo extrato de novo, ele volta.' : 'Excluir esse lançamento?')) return;
  try { await DB.del('movimentos',{id}); await carregar('movimentos'); fecharSheet(); toast('Excluído'); render(); } catch(e){ toast(erroMsg(e)); }
}
// Divide uma entrada (ex.: boletos do dia somados) entre vários afiliados, sem mudar o total do caixa.
function distribuir(id){
  const m = S.movimentos.find(x=>x.id===id);
  const ops = S.afiliados.filter(a=>a.ativo).sort((a,b)=>a.nome.localeCompare(b.nome));
  abrirSheet(`<h3>Dar baixa em afiliados</h3><p class="muted">${fdata(m.data)} · ${esc(m.descricao)} · total <b class="val">${brl(m.valor)}</b></p>
  <div id="dLinhas"></div>
  <button class="btn ghost sm" style="margin-top:8px" onclick="dAdd()">${IC.plus} Adicionar afiliado</button>
  <p class="muted" id="dRes" style="margin-top:10px"></p>
  <div class="err" id="dErr"></div>
  <div class="row" style="margin-top:8px"><button class="btn ghost grow" onclick="formMov(${id})">Voltar</button><button class="btn acc grow" onclick="dSalvar(${id})">Confirmar baixa</button></div>`);
  window._dOps = ops; window._dTot = m.valor; dAdd();
}
function dAdd(){
  const d = document.createElement('div'); d.className='row f'; d.style.marginTop='8px';
  d.innerHTML = `<select class="grow" style="min-width:0">${'<option value="">Escolha o afiliado…</option>'+window._dOps.map(a=>`<option value="${a.id}" data-v="${a.valor_mensal}">${esc(a.nome)}</option>`).join('')}</select>
    <input inputmode="decimal" placeholder="valor" style="width:96px;flex:none">`;
  const [sel, inp] = d.children;
  sel.onchange = () => { if (!inp.value) inp.value = String(sel.selectedOptions[0].dataset.v||'').replace('.',','); dRes(); };
  inp.oninput = dRes; $('#dLinhas').appendChild(d);
}
function dLer(){ return [...$('#dLinhas').children].map(d=>({ af:+d.children[0].value, v: parseFloat((d.children[1].value||'').replace(/\./g,'').replace(',','.'))||0 })).filter(x=>x.af && x.v>0); }
function dRes(){ const l=dLer(); const s=l.reduce((a,x)=>a+x.v,0); const r=window._dTot-s;
  $('#dRes').innerHTML = `Distribuído <b class="val">${brl(s)}</b> · ${r>=-0.005 ? `sobra <b class="val">${brl(r)}</b> sem dono` : `<span class="neg">passou ${brl(-r)} do total</span>`}`; }
async function dSalvar(id){
  const m = S.movimentos.find(x=>x.id===id); const l = dLer(); const s = l.reduce((a,x)=>a+x.v,0);
  if (!l.length) return $('#dErr').textContent='Escolha pelo menos um afiliado.';
  if (s - m.valor > 0.005) return $('#dErr').textContent='A soma passou do valor do lançamento.';
  try {
    const filhos = l.map((x,i)=>({ data:m.data, descricao:m.descricao, nome:S.afiliados.find(a=>a.id===x.af).nome, documento:null, valor:x.v,
      categoria:'Mensalidade', afiliado_id:x.af, origem:m.origem, chave: m.chave ? `${m.chave}#${Date.now()}-${i}` : null }));
    await DB.ins('movimentos', filhos);
    await DB.upd('movimentos', {id}, { valor: Math.round((m.valor - s)*100)/100 }); // linha original fica com a sobra (0 some das listas, mas segura a chave contra reimportação)
    await carregar('movimentos'); fecharSheet(); toast(`Baixa feita para ${l.length} afiliado(s)`); render();
  } catch(e){ $('#dErr').textContent = erroMsg(e); }
}

async function lerArquivo(file){
  if (!file) return;
  $('#impMsg').innerHTML = `<div class="card"><span class="spin"></span> Lendo ${esc(file.name)}…</div>`;
  try {
    let linhas;
    if (/\.pdf$/i.test(file.name)) linhas = await lerPDF(file);
    else linhas = await lerPlanilha(file);
    if (!linhas.length) throw new Error('Não encontrei lançamentos nesse arquivo. Se for outro banco, me mande um exemplo para eu ajustar o leitor.');
    S.imp = { arquivo:file.name, linhas }; reclassificarImp(); S.impFiltro='identificar';
    if (!S.imp.linhas.some(l=>l.k==='nid' || l.k==='sug')) S.impFiltro = 'todas';
    vImpPreview();
  } catch(e){ console.error(e); $('#impMsg').innerHTML = `<div class="card" style="background:var(--bad-soft);border:0"><b>Não consegui ler o arquivo</b><p class="muted" style="margin:4px 0 0">${esc(e.message)}</p></div>`; }
}
function parseValor(v){
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim(); if (!s) return null;
  let neg = /^-|-$|\(.*\)|\bD$/i.test(s); s = s.replace(/[^\d,.-]/g,'').replace(/-/g,'');
  if (!s) return null;
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',','.'); else s = s.replace(/,/g,'');
  const n = parseFloat(s); return isNaN(n) ? null : (neg ? -n : n);
}
function parseData(v){
  if (v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if (typeof v === 'number' && v > 30000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0,10); }
  const m = String(v ?? '').match(/(\d{2})\/(\d{2})\/(\d{2,4})/); if (!m) return null;
  const y = m[3].length===2 ? '20'+m[3] : m[3]; return `${y}-${m[2]}-${m[1]}`;
}
async function lerPlanilha(file){
  if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:false, raw:false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  // alguns bancos gravam o tamanho da planilha errado (!ref) — recalcula pelas células reais
  let maxR = 0, maxC = 0;
  Object.keys(ws).forEach(k => { if (k[0]==='!') return; const c = XLSX.utils.decode_cell(k); if (c.r>maxR) maxR=c.r; if (c.c>maxC) maxC=c.c; });
  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR,c:maxC}});
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  // acha a linha de cabeçalho (tem "Data" e "Valor")
  let hi = rows.findIndex(r => r.some(c=>/^data$/i.test(String(c).trim())) && r.some(c=>/valor/i.test(String(c))));
  if (hi < 0) throw new Error('Não achei o cabeçalho com as colunas "Data" e "Valor".');
  const H = rows[hi].map(c=>norm(c));
  const col = (...re) => H.findIndex(h => re.some(r=>r.test(h)));
  const cData = col(/^DATA/), cDesc = col(/LANCAMENTO|HISTORICO|DESCRICAO/), cNome = col(/RAZAO|NOME|FAVORECIDO|PAGADOR/),
        cDoc = col(/CPF|CNPJ|DOCUMENTO/), cVal = col(/^VALOR/), cCred = col(/CREDITO/), cDeb = col(/DEBITO/);
  const out = [];
  for (const r of rows.slice(hi+1)){
    const data = parseData(r[cData]); if (!data) continue;
    const desc = String(r[cDesc] ?? '').trim();
    let valor = cVal>=0 ? parseValor(r[cVal]) : null;
    if (valor == null && (cCred>=0 || cDeb>=0)) { const c = parseValor(r[cCred]), d = parseValor(r[cDeb]); valor = c ? Math.abs(c) : d ? -Math.abs(d) : null; }
    if (valor == null || valor === 0) continue;
    if (/^SALDO/i.test(desc)) continue;
    out.push({ data, descricao: desc, nome: cNome>=0 ? String(r[cNome]??'').trim() : '', documento: cDoc>=0 ? dig(r[cDoc]) : '', valor: Math.round(valor*100)/100 });
  }
  return out;
}
async function lerPDF(file){
  if (!window.pdfjsLib){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = []; let ultData = null;
  const reVal = /-?\(?\d{1,3}(?:\.\d{3})*,\d{2}\)?\s?[-DC]?(?=\s|$)/g;
  const reDoc = /\d{3}\.\d{3}\.\d{3}-\d{2}|\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}|\*{3}\.\d{3}\.\d{3}-\*{2}/;
  for (let p=1; p<=pdf.numPages; p++){
    const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
    const linhas = {};
    tc.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5]/3)*3; (linhas[y] = linhas[y] || []).push({x:it.transform[4], s:it.str}); });
    Object.keys(linhas).map(Number).sort((a,b)=>b-a).forEach(y => {
      const txt = linhas[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
      const md = txt.match(/^(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+/);
      let resto = txt, data = ultData;
      if (md){ let ds = md[1]; if (ds.length===5) ds += '/' + new Date().getFullYear(); data = parseData(ds); ultData = data; resto = txt.slice(md[0].length); }
      if (!data) return;
      const vals = resto.match(reVal); if (!vals) return;
      if (/SALDO/i.test(resto)) return;
      const valor = parseValor(vals[0]); if (!valor) return;
      const doc = (resto.match(reDoc)||[''])[0];
      let desc = resto.slice(0, resto.indexOf(vals[0])).replace(doc,'').trim();
      out.push({ data, descricao: desc, nome:'', documento: dig(doc), valor });
    });
  }
  return out;
}
// classifica cada linha: dup (já importada) | cpf (baixa automática) | sug (sugestão por nome) | nid (entrada sem dono) | sai (saída)
function reclassificarImp(){
  const I = S.imp; if (!I) return;
  const chaves = new Set(S.movimentos.map(m=>m.chave).filter(Boolean));
  const porDoc = new Map(S.afiliados.filter(a=>a.cpf).map(a=>[dig(a.cpf), a]));
  const cont = {};
  I.linhas.forEach(l => {
    const base = `${l.data}|${norm(l.descricao)}|${l.documento}|${l.valor.toFixed(2)}`;
    cont[base] = (cont[base]||0) + 1; l.chave = `${base}|${cont[base]}`;
    l.categoria = l.categoria_user || catAuto(l.descricao, l.nome, l.valor);
    l.sug = null;
    if (chaves.has(l.chave)) { l.k='dup'; l.on=false; return; }
    if (l.valor < 0) { l.k='sai'; l.on = l.on ?? true; l.afiliado_id = null; return; }
    const a = l.documento && porDoc.get(l.documento);
    if (a) { l.k='cpf'; l.afiliado_id = a.id; l.on = true; return; }
    if (l.afiliado_id_user) { l.k='ok'; l.afiliado_id = l.afiliado_id_user; l.on=true; return; }
    l.afiliado_id = null; l.k='nid'; l.on = l.on ?? true;
    // sugestão pelo nome: só se o primeiro nome (e o segundo, quando existir) bater com UM afiliado
    const nomeTxt = norm(l.nome || l.descricao.replace(/^(PIX (RECEBIDO|QRS|DEVOLVIDO)|BOLETOS? RECEBIDOS?)\s*/i,'').replace(/\d.*$/,''));
    const toks = nomeTxt.split(' ').filter(t=>t.length>2);
    if (toks.length){
      const cands = S.afiliados.filter(a => { const an = norm(a.nome).split(' '); return toks.length>=2 ? an[0]===toks[0] && an.slice(1).some(t=>t.startsWith(toks[1])) : an[0]===toks[0]; });
      if (cands.length === 1 && cands[0].valor_mensal >= 0) { l.k='sug'; l.sug = cands[0].id; }
    }
  });
}

function linhaImp(l, i){
  const opsAf = S.afiliados.filter(a=>a.ativo).sort((a,b)=>a.nome.localeCompare(b.nome));
  const sa = l.sug && S.afiliados.find(a=>a.id===l.sug);

  else if (l.k==='sai') destino = `<select onchange="S.imp.linhas[${i}].categoria_user=this.value;reclassificarImp()">${CAT_SAI.map(c=>`<option ${c===l.categoria?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  else destino = `<select onchange="impDest(${i},this.value)">
      <optgroup label="Categoria">${CAT_ENT.filter(c=>c!=='Mensalidade').map(c=>`<option value="c:${esc(c)}" ${!l.afiliado_id && c===l.categoria?'selected':''}>${esc(c)}</option>`).join('')}</optgroup>
      <optgroup label="Mensalidade de…">${opsAf.map(a=>`<option value="a:${a.id}" ${a.id===l.afiliado_id?'selected':''}>${esc(a.nome)}</option>`).join('')}</optgroup></select>
    ${sa || (l.documento && !l.afiliado_id) ? `<div class="sug">${sa?`<button class="btn sm" style="background:var(--warn);color:#fff" onclick="impDest(${i},'a:${sa.id}')">É ${esc(sa.nome.split(' ').slice(0,2).join(' '))}?</button>`:''}
      ${l.documento && !l.afiliado_id ? `<button class="btn sm ghost" onclick="impNovoAf(${i})">${IC.plus} Cadastrar afiliado</button>`:''}</div>`:''}`;
  return `<div class="imp ${l.k==='dup'?'dup':l.k==='cpf'||l.k==='ok'?'k-cpf':l.k==='sug'?'k-sug':''}">
    <input type="checkbox" ${l.on?'checked':''} ${l.k==='dup'?'disabled':''} onchange="S.imp.linhas[${i}].on=this.checked;vImpPreview()">
    <div style="min-width:0"><div class="top2"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.nome || l.descricao)}</b><b class="val ${l.valor>0?'pos':'neg'}" style="white-space:nowrap">${brl(l.valor)}</b></div>
    <div class="d">${fdata(l.data)}${l.nome?' · '+esc(l.descricao):''}${l.documento?' · '+fmtDoc(l.documento):''}</div>${destino}</div></div>`;
}
function impDest(i, v){
  const l = S.imp.linhas[i];

  formAf(null, { nome: (l.nome||'').replace(/\s+\d{11}$/,''), cpf: l.documento, valor_mensal: l.valor }); }
async function confirmarImp(){

  if (!sel.length) return;
  const btn = $('#impGo'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Importando…';

    categoria: l.afiliado_id ? 'Mensalidade' : l.categoria, afiliado_id: l.valor>0 ? (l.afiliado_id||null) : null, origem:'extrato', chave:l.chave }));

    S.imp = null;
    abrirSheet(`<h3>Importação concluída ✔</h3>
      <dl class="kv"><dt>Lançamentos gravados</dt><dd>${ins.length}</dd><dt>Baixas de mensalidade</dt><dd>${baixas}</dd>
      <dt>Saídas</dt><dd>${rows.filter(r=>r.valor<0).length}</dd>${rows.length-ins.length?`<dt>Ignorados (já existiam)</dt><dd>${rows.length-ins.length}</dd>`:''}</dl>
      <div class="row" style="margin-top:16px"><button class="btn ghost grow" onclick="fecharSheet();ir('financeiro')">Ver financeiro</button><button class="btn acc grow" onclick="fecharSheet();S.filtroAf='atraso';ir('afiliados')">Ver atrasados</button></div>`);
    vImportar();
  } catch(e){ toast(erroMsg(e), 4000); btn.disabled=false; btn.textContent='Tentar de novo'; }
}

/* =====================================================================
   CONFIGURAÇÕES / USUÁRIOS
   ===================================================================== */
function abrirConfig(){
  const adm = S.me.papel === 'adm';
  abrirSheet(`<h3>Configurações</h3>
    <dl class="kv"><dt>Usuário</dt><dd>${esc(S.me.nome)}</dd><dt>E-mail</dt><dd>${esc(S.me.email)}</dd><dt>Perfil</dt><dd>${S.me.papel==='adm'?'Administrador':'Membro'}</dd></dl>
    ${adm ? `<div class="sec-h"><h2 style="font-size:17px">Quem pode acessar</h2></div>
      <div class="list">${S.usuarios.map(u=>`<div class="li" style="cursor:default"><div class="grow"><div class="t">${esc(u.nome)}</div><div class="s">${esc(u.email)}</div></div>
        <span class="badge ${u.papel==='adm'?'b-acc':'b-mute'}">${u.papel==='adm'?'adm':'membro'}</span>
        ${u.email!==S.me.email?`<button class="btn sm ${u.ativo?'ghost':'danger'}" onclick="uTog('${esc(u.email)}',${!u.ativo})">${u.ativo?'Bloquear':'Liberar'}</button>`:''}</div>`).join('')}</div>
      <form class="f" id="fU"><label>Liberar novo acesso</label>
        <input name="nome" placeholder="Nome" required><div class="g2" style="margin-top:8px"><input name="email" type="email" placeholder="E-mail" required>
        <select name="papel"><option value="membro">Membro</option><option value="adm">Administrador</option></select></div>
        <button class="btn acc wide" style="margin-top:10px">Liberar acesso</button>
        <p class="muted">Depois a pessoa abre o app, toca em <b>Primeiro acesso</b> e cria a senha com esse e-mail.</p></form>` : ''}
    <div class="sec-h"><h2 style="font-size:17px">Dados</h2></div>
    <button class="btn ghost wide" onclick="exportar()">Baixar planilha (afiliados + financeiro)</button>
    <button class="btn danger wide" style="margin-top:10px" onclick="sair()">${IC.out} Sair</button>
    <p class="muted" style="text-align:center;margin-top:14px">Mastodonte Gestão ${VERSAO}${DEMO?' · demonstração':''}</p>`);
  $('#fU')?.addEventListener('submit', async ev => { ev.preventDefault(); const f=new FormData(ev.target);
    const email = f.get('email').trim().toLowerCase();
    if (S.usuarios.some(u=>u.email===email)) return toast('Esse e-mail já está na lista.');
    try { await DB.ins('usuarios',{email, nome:f.get('nome').trim(), papel:f.get('papel'), ativo:true}); await carregar('usuarios'); toast('Acesso liberado'); abrirConfig(); } catch(e){ toast(erroMsg(e)); } });
}
async function uTog(email, ativo){ try { await DB.upd('usuarios',{email},{ativo}); await carregar('usuarios'); abrirConfig(); } catch(e){ toast(erroMsg(e)); } }
async function exportar(){
  try {
    if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const af = S.afiliados.map(a=>{ const s=statusAf(a); return { Nome:a.nome, 'CPF/CNPJ':fmtDoc(a.cpf), Telefone:fmtTel(a.telefone), Endereço:a.endereco||'',
      'Doação/mês':a.valor_mensal, 'Dia venc.':a.dia_vencimento, 'Cobrar desde':a.inicio, Situação:s.txt, 'Pago até':compTxt(s.pagoAte), 'Em aberto':s.deve||0, 'Total pago':s.pago, Ativo:a.ativo?'sim':'não' }; });
    const mv = S.movimentos.filter(m=>m.valor).sort((a,b)=>a.data.localeCompare(b.data)).map(m=>({ Data:fdata(m.data), Descrição:m.descricao, Nome:m.nome||'', 'CPF/CNPJ':fmtDoc(m.documento),
      Valor:m.valor, Categoria:m.categoria||'', Afiliado:S.afiliados.find(a=>a.id===m.afiliado_id)?.nome||'', Evento:S.eventos.find(e=>e.id===m.evento_id)?.nome||'', Origem:m.origem }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(af), 'Afiliados');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mv), 'Financeiro');
    XLSX.writeFile(wb, `mastodonte-${hojeISO()}.xlsx`);
  } catch(e){ toast(erroMsg(e)); }
}

/* ---------------- partida ---------------- */
if (!DEMO) sb.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') abrirSheet(`<h3>Nova senha</h3><form class="f" id="fNs"><label>Nova senha</label><input type="password" name="s" autocomplete="new-password" minlength="6" required>
    <div class="err" id="nsErr"></div><button class="btn acc wide" style="margin-top:8px">Salvar senha</button></form>`) ||
    $('#fNs').addEventListener('submit', async e => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('s') });
      if (error) $('#nsErr').textContent = error.message; else { fecharSheet(); toast('Senha alterada'); iniciar(); } });
});
if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai')) navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
</script>
