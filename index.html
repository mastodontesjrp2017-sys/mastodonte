function parseValor(v){
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim(); if (!s) return null;
  let neg = /^-|-$|\(.*\)|\bD$/i.test(s); s = s.replace(/[^\d,.-]/g,'').replace(/-/g,'');
  if (!s) return null;
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',','.'); else s = s.replace(/,/g,'');
  const n = parseFloat(s); return isNaN(n) ? null : (neg ? -n : n);
}
function parseData(v){
  if (v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if (typeof v === 'number' && v > 30000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0,10); }
  const m = String(v ?? '').match(/(\d{2})\/(\d{2})\/(\d{2,4})/); if (!m) return null;
  const y = m[3].length===2 ? '20'+m[3] : m[3]; return `${y}-${m[2]}-${m[1]}`;
}
async function lerPlanilha(file){
  if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:false, raw:false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  // alguns bancos gravam o tamanho da planilha errado (!ref) — recalcula pelas células reais
  let maxR = 0, maxC = 0;
  Object.keys(ws).forEach(k => { if (k[0]==='!') return; const c = XLSX.utils.decode_cell(k); if (c.r>maxR) maxR=c.r; if (c.c>maxC) maxC=c.c; });
  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR,c:maxC}});
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  // acha a linha de cabeçalho (tem "Data" e "Valor")
  let hi = rows.findIndex(r => r.some(c=>/^data$/i.test(String(c).trim())) && r.some(c=>/valor/i.test(String(c))));
  if (hi < 0) throw new Error('Não achei o cabeçalho com as colunas "Data" e "Valor".');
  const H = rows[hi].map(c=>norm(c));
  const col = (...re) => H.findIndex(h => re.some(r=>r.test(h)));
  const cData = col(/^DATA/), cDesc = col(/LANCAMENTO|HISTORICO|DESCRICAO/), cNome = col(/RAZAO|NOME|FAVORECIDO|PAGADOR/),
        cDoc = col(/CPF|CNPJ|DOCUMENTO/), cVal = col(/^VALOR/), cCred = col(/CREDITO/), cDeb = col(/DEBITO/);
  const out = [];
  for (const r of rows.slice(hi+1)){
    const data = parseData(r[cData]); if (!data) continue;
    const desc = String(r[cDesc] ?? '').trim();
    let valor = cVal>=0 ? parseValor(r[cVal]) : null;
    if (valor == null && (cCred>=0 || cDeb>=0)) { const c = parseValor(r[cCred]), d = parseValor(r[cDeb]); valor = c ? Math.abs(c) : d ? -Math.abs(d) : null; }
    if (valor == null || valor === 0) continue;
    if (/^SALDO/i.test(desc)) continue;
    out.push({ data, descricao: desc, nome: cNome>=0 ? String(r[cNome]??'').trim() : '', documento: cDoc>=0 ? dig(r[cDoc]) : '', valor: Math.round(valor*100)/100 });
  }
  return out;
}
async function lerPDF(file){
  if (!window.pdfjsLib){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = []; let ultData = null;
  const reVal = /-?\(?\d{1,3}(?:\.\d{3})*,\d{2}\)?\s?[-DC]?(?=\s|$)/g;
  const reDoc = /\d{3}\.\d{3}\.\d{3}-\d{2}|\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}|\*{3}\.\d{3}\.\d{3}-\*{2}/;
  for (let p=1; p<=pdf.numPages; p++){
    const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
    const linhas = {};
    tc.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5]/3)*3; (linhas[y] = linhas[y] || []).push({x:it.transform[4], s:it.str}); });
    Object.keys(linhas).map(Number).sort((a,b)=>b-a).forEach(y => {
      const txt = linhas[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
      const md = txt.match(/^(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+/);
      let resto = txt, data = ultData;
      if (md){ let ds = md[1]; if (ds.length===5) ds += '/' + new Date().getFullYear(); data = parseData(ds); ultData = data; resto = txt.slice(md[0].length); }
      if (!data) return;
      const vals = resto.match(reVal); if (!vals) return;
      if (/SALDO/i.test(resto)) return;
      const valor = parseValor(vals[0]); if (!valor) return;
      const doc = (resto.match(reDoc)||[''])[0];
      let desc = resto.slice(0, resto.indexOf(vals[0])).replace(doc,'').trim();
      out.push({ data, descricao: desc, nome:'', documento: dig(doc), valor });
    });
  }
  return out;
}
// classifica cada linha: dup (já importada) | cpf (baixa automática) | sug (sugestão por nome) | nid (entrada sem dono) | sai (saída)
function reclassificarImp(){
  const I = S.imp; if (!I) return;
  const chaves = new Set(S.movimentos.map(m=>m.chave).filter(Boolean));
  const porDoc = new Map(S.afiliados.filter(a=>a.cpf).map(a=>[dig(a.cpf), a]));
  const cont = {};
  I.linhas.forEach(l => {
    const base = `${l.data}|${norm(l.descricao)}|${l.documento}|${l.valor.toFixed(2)}`;
    cont[base] = (cont[base]||0) + 1; l.chave = `${base}|${cont[base]}`;
    l.categoria = l.categoria_user || catAuto(l.descricao, l.nome, l.valor);
    l.sug = null;
    if (chaves.has(l.chave)) { l.k='dup'; l.on=false; return; }
    if (l.valor < 0) { l.k='sai'; l.on = l.on ?? true; l.afiliado_id = null; return; }
    const a = l.documento && porDoc.get(l.documento);
    if (a) { l.k='cpf'; l.afiliado_id = a.id; l.on = true; return; }
    if (l.afiliado_id_user) { l.k='ok'; l.afiliado_id = l.afiliado_id_user; l.on=true; return; }
    l.afiliado_id = null; l.k='nid'; l.on = l.on ?? true;
    // sugestão pelo nome: só se o primeiro nome (e o segundo, quando existir) bater com UM afiliado
    const nomeTxt = norm(l.nome || l.descricao.replace(/^(PIX (RECEBIDO|QRS|DEVOLVIDO)|BOLETOS? RECEBIDOS?)\s*/i,'').replace(/\d.*$/,''));
    const toks = nomeTxt.split(' ').filter(t=>t.length>2);
    if (toks.length){
      const cands = S.afiliados.filter(a => { const an = norm(a.nome).split(' '); return toks.length>=2 ? an[0]===toks[0] && an.slice(1).some(t=>t.startsWith(toks[1])) : an[0]===toks[0]; });
      if (cands.length === 1 && cands[0].valor_mensal >= 0) { l.k='sug'; l.sug = cands[0].id; }
    }
  });
}
function vImpPreview(){
  const I = S.imp; const L = I.linhas;
  const c = k => L.filter(l=>l.k===k);
  const novas = L.filter(l=>l.k!=='dup');
  const F = [['identificar','A identificar',[...c('sug'),...c('nid')]],['baixas','Baixas',[...c('cpf'),...c('ok')]],['saidas','Saídas',c('sai')],['todas','Todas',L]];
  const atual = F.find(f=>f[0]===S.impFiltro)[2];
  const totSel = novas.filter(l=>l.on);
  const ini = L.reduce((a,l)=>l.data<a?l.data:a, '9'), fim = L.reduce((a,l)=>l.data>a?l.data:a, '0');
  $('#view').innerHTML = `
    <div class="card"><div class="row"><div class="grow"><b>${esc(I.arquivo)}</b><div class="muted">${fdata(ini)} a ${fdata(fim)} · ${L.length} lançamentos</div></div>
      <button class="btn sm ghost" onclick="S.imp=null;vImportar()">Trocar</button></div>
      <div class="kpis" style="margin-top:10px">
        <div class="card kpi ok"><small>Baixa por CPF</small><b>${c('cpf').length + c('ok').length}</b></div>
        <div class="card kpi"><small>A identificar</small><b>${c('sug').length + c('nid').length}</b><span class="muted">${c('sug').length} com sugestão</span></div>
        <div class="card kpi"><small>Saídas</small><b>${c('sai').length}</b></div>
        <div class="card kpi"><small>Já importadas</small><b>${c('dup').length}</b></div>
      </div></div>
    <div class="chips" style="margin-top:12px">${F.map(([k,n,arr])=>`<button class="chip ${S.impFiltro===k?'on':''}" onclick="S.impFiltro='${k}';vImpPreview()">${n}<span class="n">${arr.length}</span></button>`).join('')}</div>
    <div class="list" style="margin-top:8px">${atual.length ? atual.slice(0,400).map(l=>linhaImp(l, L.indexOf(l))).join('') : '<div class="empty">Nada aqui.</div>'}</div>
    ${atual.length>400?`<p class="muted">Mostrando 400 de ${atual.length}. Todas serão importadas.</p>`:''}
    <div style="position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:12px">
      <button class="btn acc wide" id="impGo" onclick="confirmarImp()" ${totSel.length?'':'disabled'}>Importar ${totSel.length} lançamento${totSel.length!==1?'s':''}</button></div>`;
}
function linhaImp(l, i){
  const opsAf = S.afiliados.filter(a=>a.ativo).sort((a,b)=>a.nome.localeCompare(b.nome));
  const sa = l.sug && S.afiliados.find(a=>a.id===l.sug);
  let destino = '';
  if (l.k==='dup') destino = `<div class="muted">Já importado antes</div>`;
  else if (l.k==='cpf') destino = `<div class="muted" style="color:var(--ok)">✔ Baixa na mensalidade de <b>${esc(S.afiliados.find(a=>a.id===l.afiliado_id)?.nome)}</b> (CPF confere)</div>`;
  else if (l.k==='sai') destino = `<select onchange="S.imp.linhas[${i}].categoria_user=this.value;reclassificarImp()">${CAT_SAI.map(c=>`<option ${c===l.categoria?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  else destino = `<select onchange="impDest(${i},this.value)">
      <optgroup label="Categoria">${CAT_ENT.filter(c=>c!=='Mensalidade').map(c=>`<option value="c:${esc(c)}" ${!l.afiliado_id && c===l.categoria?'selected':''}>${esc(c)}</option>`).join('')}</optgroup>
      <optgroup label="Mensalidade de…">${opsAf.map(a=>`<option value="a:${a.id}" ${a.id===l.afiliado_id?'selected':''}>${esc(a.nome)}</option>`).join('')}</optgroup></select>
    ${sa || (l.documento && !l.afiliado_id) ? `<div class="sug">${sa?`<button class="btn sm" style="background:var(--warn);color:#fff" onclick="impDest(${i},'a:${sa.id}')">É ${esc(sa.nome.split(' ').slice(0,2).join(' '))}?</button>`:''}
      ${l.documento && !l.afiliado_id ? `<button class="btn sm ghost" onclick="impNovoAf(${i})">${IC.plus} Cadastrar afiliado</button>`:''}</div>`:''}`;
  return `<div class="imp ${l.k==='dup'?'dup':l.k==='cpf'||l.k==='ok'?'k-cpf':l.k==='sug'?'k-sug':''}">
    <input type="checkbox" ${l.on?'checked':''} ${l.k==='dup'?'disabled':''} onchange="S.imp.linhas[${i}].on=this.checked;vImpPreview()">
    <div style="min-width:0"><div class="top2"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.nome || l.descricao)}</b><b class="val ${l.valor>0?'pos':'neg'}" style="white-space:nowrap">${brl(l.valor)}</b></div>
    <div class="d">${fdata(l.data)}${l.nome?' · '+esc(l.descricao):''}${l.documento?' · '+fmtDoc(l.documento):''}</div>${destino}</div></div>`;
}
function impDest(i, v){
  const l = S.imp.linhas[i];
  if (v.startsWith('a:')) { l.afiliado_id_user = +v.slice(2); l.categoria_user = 'Mensalidade'; }
  else { l.afiliado_id_user = null; l.categoria_user = v.slice(2); }
  reclassificarImp(); vImpPreview();
}
function impNovoAf(i){ const l = S.imp.linhas[i];
  formAf(null, { nome: (l.nome||'').replace(/\s+\d{11}$/,''), cpf: l.documento, valor_mensal: l.valor }); }
async function confirmarImp(){
  const sel = S.imp.linhas.filter(l=>l.k!=='dup' && l.on);
  if (!sel.length) return;
  const btn = $('#impGo'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Importando…';
  const rows = sel.map(l=>({ data:l.data, descricao:l.descricao || '(sem descrição)', nome:l.nome||null, documento:l.documento||null, valor:l.valor,
    categoria: l.afiliado_id ? 'Mensalidade' : l.categoria, afiliado_id: l.valor>0 ? (l.afiliado_id||null) : null, origem:'extrato', chave:l.chave }));
  try {
    const ins = await DB.ins('movimentos', rows, true);
    await carregar('movimentos');
    const baixas = rows.filter(r=>r.afiliado_id).length;
    S.imp = null;
    abrirSheet(`<h3>Importação concluída ✔</h3>
      <dl class="kv"><dt>Lançamentos gravados</dt><dd>${ins.length}</dd><dt>Baixas de mensalidade</dt><dd>${baixas}</dd>
      <dt>Saídas</dt><dd>${rows.filter(r=>r.valor<0).length}</dd>${rows.length-ins.length?`<dt>Ignorados (já existiam)</dt><dd>${rows.length-ins.length}</dd>`:''}</dl>
      <div class="row" style="margin-top:16px"><button class="btn ghost grow" onclick="fecharSheet();ir('financeiro')">Ver financeiro</button><button class="btn acc grow" onclick="fecharSheet();S.filtroAf='atraso';ir('afiliados')">Ver atrasados</button></div>`);
    vImportar();
  } catch(e){ toast(erroMsg(e), 4000); btn.disabled=false; btn.textContent='Tentar de novo'; }
}

/* =====================================================================
   CONFIGURAÇÕES / USUÁRIOS
   ===================================================================== */
function abrirConfig(){
  const adm = S.me.papel === 'adm';
  abrirSheet(`<h3>Configurações</h3>
    <dl class="kv"><dt>Usuário</dt><dd>${esc(S.me.nome)}</dd><dt>E-mail</dt><dd>${esc(S.me.email)}</dd><dt>Perfil</dt><dd>${S.me.papel==='adm'?'Administrador':'Financeiro'}</dd></dl>
    ${adm ? `<div class="sec-h"><h2 style="font-size:18px">Quem pode acessar</h2></div>
      <div class="list">${S.usuarios.map(u=>`<div class="li" style="cursor:default"><div class="grow"><div class="t">${esc(u.nome)}</div><div class="s">${esc(u.email)}</div></div>
        <span class="badge ${u.papel==='adm'?'b-acc':'b-mute'}">${u.papel==='adm'?'adm':'financeiro'}</span>
        ${u.email!==S.me.email?`<button class="btn sm ${u.ativo?'ghost':'danger'}" onclick="uTog('${esc(u.email)}',${!u.ativo})">${u.ativo?'Bloquear':'Liberar'}</button><button class="btn sm danger" aria-label="Excluir acesso" onclick="uDel('${esc(u.email)}')">Excluir</button>`:''}</div>`).join('')}</div>
      <form class="f" id="fU"><label>Liberar novo acesso</label>
        <input name="nome" placeholder="Nome" required><div class="g2" style="margin-top:8px"><input name="email" type="email" placeholder="E-mail" required>
        <select name="papel"><option value="financeiro">Financeiro (só pagamentos e saídas, sem CPF)</option><option value="adm">Administrador (tudo)</option></select></div>
        <button class="btn acc wide" style="margin-top:10px">Liberar acesso</button>
        <p class="muted">Depois a pessoa abre o app, toca em <b>Primeiro acesso</b> e cria a senha com esse e-mail.</p></form>` : ''}
    ${adm ? `<div class="sec-h"><h2 style="font-size:18px">Transparência</h2></div>
      <form class="f" id="fTr"><label>Mostrar aos associados as movimentações a partir de</label>
        <div class="row"><input type="date" name="ini" value="${transIni()}" class="grow" required><button class="btn sm acc" style="min-height:46px">Salvar</button></div>
        <p class="muted">O que for anterior a essa data não aparece na página de transparência.</p></form>` : ''}
    ${adm ? `<div class="sec-h"><h2 style="font-size:18px">Dados</h2></div>
    <button class="btn ghost wide" onclick="exportar()">Baixar planilha (afiliados + financeiro)</button>` : ''}
    <button class="btn danger wide" style="margin-top:10px" onclick="sair()">${IC.out} Sair</button>
    <p class="muted" style="text-align:center;margin-top:14px">Mastodonte Gestão ${VERSAO}${DEMO?' · demonstração':''}</p>`);
  $('#fTr')?.addEventListener('submit', async ev => { ev.preventDefault(); const v = new FormData(ev.target).get('ini');
    try { if (DEMO) throw new Error('Indisponível na demonstração.');
      const { error } = await sb.from('configuracoes').upsert({ chave:'transparencia_inicio', valor:v }); if (error) throw error;
      await carregar('configuracoes'); toast('Data da transparência salva'); render(); } catch(e){ toast(erroMsg(e)); } });
  $('#fU')?.addEventListener('submit', async ev => { ev.preventDefault(); const f=new FormData(ev.target);
    const email = f.get('email').trim().toLowerCase();
    if (S.usuarios.some(u=>u.email===email)) return toast('Esse e-mail já está na lista.');
    try { await DB.ins('usuarios',{email, nome:f.get('nome').trim(), papel:f.get('papel'), ativo:true}); await carregar('usuarios'); toast('Acesso liberado'); abrirConfig(); } catch(e){ toast(erroMsg(e)); } });
}
async function uDel(email){
  const u = S.usuarios.find(x=>x.email===email);
  if (!(await confirmar('Excluir acesso ao app?', `${u?.nome||email} não vai mais conseguir entrar no app, e a conta de login dele será apagada. Se precisar, você pode liberar o acesso de novo depois.`, 'Excluir'))) return;
  try { if (DEMO){ await DB.del('usuarios',{email}); }
    else { const { error } = await sb.rpc('excluir_usuario', { p_email: email }); if (error) throw error; }
    await carregar('usuarios'); toast('Acesso excluído'); abrirConfig(); } catch(e){ toast(erroMsg(e)); }
}
async function uTog(email, ativo){ try { await DB.upd('usuarios',{email},{ativo}); await carregar('usuarios'); abrirConfig(); } catch(e){ toast(erroMsg(e)); } }
async function exportar(){
  try {
    if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const af = S.afiliados.map(a=>{ const s=statusAf(a); return { Nome:a.nome, 'CPF/CNPJ':fmtDoc(a.cpf), Telefone:fmtTel(a.telefone), Endereço:a.endereco||'',
      'Doação/mês':a.valor_mensal, 'Dia venc.':a.dia_vencimento, 'Cobrar desde':a.inicio, Situação:s.txt, 'Pago até':compTxt(s.pagoAte), 'Em aberto':s.deve||0, 'Total pago':s.pago, Camisa: a.tamanho_camisa||'', Ativo:a.ativo?'sim':'não', ['Renovou '+ANO_RENOV]: renovou(a)?'sim':'não', 'Link renovação': linkRenov(a)||'' }; });
    const mv = S.movimentos.filter(m=>m.valor).sort((a,b)=>a.data.localeCompare(b.data)).map(m=>({ Data:fdata(m.data), Descrição:m.descricao, Nome:m.nome||'', 'CPF/CNPJ':fmtDoc(m.documento),
      Valor:m.valor, Categoria:m.categoria||'', Afiliado:S.afiliados.find(a=>a.id===m.afiliado_id)?.nome||'', Evento:S.eventos.find(e=>e.id===m.evento_id)?.nome||'', Origem:m.origem }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(af), 'Afiliados');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mv), 'Financeiro');
    XLSX.writeFile(wb, `mastodonte-${hojeISO()}.xlsx`);
  } catch(e){ toast(erroMsg(e)); }
}

/* ---------------- partida ---------------- */
if (!DEMO) sb.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') abrirSheet(`<h3>Nova senha</h3><form class="f" id="fNs"><label>Nova senha</label><input type="password" name="s" autocomplete="new-password" minlength="6" required>
    <div class="err" id="nsErr"></div><button class="btn acc wide" style="margin-top:8px">Salvar senha</button></form>`) ||
    $('#fNs').addEventListener('submit', async e => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('s') });
      if (error) $('#nsErr').textContent = error.message; else { fecharSheet(); toast('Senha alterada'); iniciar(); } });
});
if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai')) navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
