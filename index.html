<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mastodonte Gestão</title>
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mastodonte">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#161513; --ink2:#4f4a43; --ink3:#6e685d; --line:#e3ddd0;
  --brand:#141414; --brand-ink:#f0eadc; --accent:#b8742a; --accent-soft:#f3e4cf;
  --ok:#2f7a4c; --ok-soft:#e1f0e5; --warn:#9a6f00; --warn-soft:#f8edc8; --bad:#b8352a; --bad-soft:#f8dfdb;
  --mute-soft:#ebe7de; --shadow:0 1px 2px rgba(20,18,14,.06),0 4px 14px rgba(20,18,14,.06);
  --r:14px; --slab:"Zilla Slab",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --card:#1c1b19; --ink:#efeae0; --ink2:#c9c2b4; --ink3:#a39c8f; --line:#2e2c28;
  --brand:#0a0a0a; --brand-ink:#f0eadc; --accent:#d8964b; --accent-soft:#3a2b1a;
  --ok:#5cbf83; --ok-soft:#173222; --warn:#e2b53c; --warn-soft:#3a3013; --bad:#ec6f62; --bad-soft:#3d1b17;
  --mute-soft:#26241f; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1c1b19; --ink:#efeae0; --ink2:#c9c2b4; --ink3:#a39c8f; --line:#2e2c28;
  --brand:#0a0a0a; --brand-ink:#f0eadc; --accent:#d8964b; --accent-soft:#3a2b1a;
  --ok:#5cbf83; --ok-soft:#173222; --warn:#e2b53c; --warn-soft:#3a3013; --bad:#ec6f62; --bad-soft:#3d1b17;
  --mute-soft:#26241f; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--slab);margin:0;letter-spacing:.2px}
.hide{display:none!important}
/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{height:30px}
.top .tt{flex:1;min-width:0}
.top .tt b{font-family:var(--slab);font-size:19px;letter-spacing:1px;display:block;line-height:1}
.top .tt small{opacity:.75;font-size:13.5px}
.iconbtn{background:transparent;border:0;color:inherit;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.12)}
.iconbtn svg{width:24px;height:24px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13.5px;padding:7px 16px;text-align:center;font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px 16px}
/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;color:var(--ink3);padding:6px 0;cursor:pointer;font-weight:700;min-width:0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
/* ---------- elementos ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:12px 14px}
.kpi small{display:block;color:var(--ink2);font-size:13px;font-weight:700}
.kpi b{display:block;font-family:var(--slab);font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.bad{background:var(--bad-soft);border-color:transparent}.kpi.bad b{color:var(--bad)}
.kpi.warn{background:var(--warn-soft);border-color:transparent}.kpi.warn b{color:var(--warn)}
.kpi.ok b{color:var(--ok)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px}
.sec-h h2{font-size:20px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:46px}
.btn.acc{background:var(--accent);color:#fff}
.btn.ghost{background:var(--mute-soft);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:10px;min-height:40px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:25;width:60px;height:60px;border-radius:18px;
  background:var(--accent);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:30px;height:30px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px}
.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
/* atalhos da tela inicial */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;color:var(--ink);text-align:center}
.quick button svg{width:28px;height:28px;color:var(--accent)}
.quick button:active{background:var(--mute-soft)}
/* lista */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.li:first-child{border-top:0}
.li:active{background:var(--mute-soft)}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:14px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.li.st-atraso{background:linear-gradient(90deg,var(--bad-soft),transparent 70%)}
.li.st-atraso::before,.li.st-pendente::before,.li.st-vence::before,.li.st-emdia::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.li.st-atraso::before{background:var(--bad)}.li.st-pendente::before{background:var(--warn)}.li.st-vence::before{background:var(--warn)}.li.st-emdia::before{background:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.b-atraso{background:var(--bad);color:#fff}.b-pend{background:var(--warn);color:#fff}.b-vence{background:var(--warn-soft);color:var(--warn)}
.b-emdia{background:var(--ok-soft);color:var(--ok)}.b-mute{background:var(--mute-soft);color:var(--ink2)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--mute-soft);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink2);flex:none}
.st-atraso .avatar{background:var(--bad);color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--ink3)}
.wa{width:44px;height:44px;border-radius:12px;background:#25d366;color:#fff;display:grid;place-items:center;flex:none;border:0;cursor:pointer;text-decoration:none}
.wa svg{width:22px;height:22px}
/* barras */
.bars .b{margin-top:12px}.bars .b:first-child{margin-top:0}
.bars .bl{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px}
.bars .bt{height:9px;background:var(--mute-soft);border-radius:99px;overflow:hidden}
.bars .bf{height:100%;background:var(--accent);border-radius:99px}
/* formulário */
.f label{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.f input,.f select,.f textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font-size:16px}
.f textarea{min-height:70px;resize:vertical}
.f .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .g2 label{margin-top:14px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
.seg{display:flex;background:var(--mute-soft);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:700;color:var(--ink2);cursor:pointer;font-size:15px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,9,8,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;background:var(--line);border-radius:9px;margin:4px auto 12px}
.sheet h3{font-size:22px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;margin-top:10px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:600;word-break:break-word}
/* janela de confirmação */
.ov.ov2{z-index:70;align-items:center;padding:20px}
.dlg{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .15s ease-out}
.dlg b{display:block;font-family:var(--slab);font-size:21px;margin-bottom:6px}
.dlg p{margin:0 0 18px;font-size:16px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw;text-align:center;font-size:15px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;background:var(--brand);color:var(--brand-ink)}
.login img{width:min(260px,70vw);margin-bottom:22px}
.login .card{width:100%;max-width:380px;color:var(--ink)}
.login h1{font-size:23px;margin-bottom:2px}
.login p{margin:0 0 6px;color:var(--ink2);font-size:15px}
.lnk{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 0;font-size:15px}
/* importador */
.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--card)}
.drop b{display:block;font-family:var(--slab);font-size:20px;margin-bottom:4px}
.drop small{display:block;color:var(--ink3);font-size:14px}
.imp{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:start}
.imp:first-child{border-top:0}
.imp input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.imp .top2{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.imp .d{font-size:13.5px;color:var(--ink3)}
.imp select{width:100%;margin-top:6px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.imp.dup{opacity:.45}
.imp.k-cpf{background:var(--ok-soft)}
.imp.k-sug{background:var(--warn-soft)}
.sug{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.priv .val{filter:blur(7px)}
.muted{color:var(--ink3);font-size:14.5px}
.tag{font-size:12px;color:var(--ink3);font-weight:700}
.ev-date{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--brand);color:var(--brand-ink);padding:6px 0}
.ev-date b{display:block;font-family:var(--slab);font-size:23px;line-height:1}
.ev-date small{font-size:12px;text-transform:uppercase;font-weight:700}
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:22px;height:22px;accent-color:var(--ok)}
.task.done .grow{text-decoration:line-through;color:var(--ink3)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sheet,.dlg{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — preencher com os dados do projeto Supabase.
   Vazio = MODO DEMONSTRAÇÃO (dados ficam só no aparelho).
   ===================================================================== */
const CFG = { url: 'https://cknzysljezvpazonvibb.supabase.co', key: 'sb_publishable_ji48PdmWNR5nvQkXMhbbCQ_DEekbpVL' };
const VERSAO = 'v18';
const DEMO = !CFG.url || !CFG.key;
const sb = DEMO ? null : supabase.createClient(CFG.url, CFG.key);

/* Regras da associação */
const MENSALIDADE_PADRAO = 40;   // R$ por mês
const DIA_VENC_PADRAO = 20;      // dia do vencimento
const PIX_CHAVE = '55821595000138';   // chave PIX (CNPJ) da Associação Mastodonte
const TAMANHOS = ['PP','P','M','G','GG','XG','XGG','G1','G2','G3'];
const selCamisa = (nome, atual) => `<select name="${nome}"><option value="">— não informado —</option>${TAMANHOS.map(t=>`<option ${t===atual?'selected':''}>${t}</option>`).join('')}</select>`;
const LIMITE_CONTRIB = 250;      // Art. 9º do estatuto: máximo de sócios contribuintes (pode ser aumentado em assembleia)
const MESES_ATRASO = 3;          // a partir de quantos meses sem pagar conta como "em atraso"

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dig = s => String(s ?? '').replace(/\D/g, '');
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fdata = iso => { if (!iso) return ''; const [y,m,d] = iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; };
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const fmtDoc = d => { d = dig(d); if (d.length===11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  if (d.length===14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'); return d; };
const fmtTel = t => { t = dig(t); if (t.length===11) return t.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
  if (t.length===10) return t.replace(/(\d{2})(\d{4})(\d{4})/,'($1) $2-$3'); return t; };
const iniciais = n => (n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('');
function cpfOk(c){ c=dig(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  for (let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+= +c[i]*(t+1-i); if (((s*10)%11)%10 !== +c[t]) return false; } return true; }
function cnpjOk(c){ c=dig(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+= +c[i]*p--; if(p<2)p=9;} const r=s%11; return r<2?0:11-r; };
  return calc(12)===+c[12] && calc(13)===+c[13]; }
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
// Janela de confirmação no estilo do app (substitui o alerta do navegador)
function confirmar(titulo, texto='', okTxt='Excluir'){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov ov2';
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><b>${esc(titulo)}</b>${texto?`<p>${esc(texto).replace(/\n/g,'<br>')}</p>`:'<p></p>'}
      <div class="row"><button class="btn ghost grow" data-v="0">Cancelar</button><button class="btn bad grow" data-v="1">${esc(okTxt)}</button></div></div>`;
    ov.addEventListener('click', e => { const v = e.target.closest('[data-v]')?.dataset.v; if (v!=null || e.target===ov){ ov.remove(); res(v==='1'); } });
    document.body.appendChild(ov); ov.querySelector('[data-v="0"]').focus();
  });
}
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function loadScript(src){ return new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error('Falha ao carregar '+src)); document.head.appendChild(s); }); }

const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/></svg>',
  userplus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"/><path d="M3 20c.8-3.6 3.6-5.5 7-5.5 1.6 0 3 .4 4.2 1.1"/><path d="M19 14v6M16 17h6"/></svg>',

const DB = {
  async all(t){
    if (DEMO) return JSON.parse(JSON.stringify(Local.load()[t]));
    const out=[]; const step=1000;
    for (let i=0;;i+=step){
      const { data, error } = await sb.from(t).select(COLS[t]||'*').order(t==='usuarios'?'email':t==='configuracoes'?'chave':'id').range(i, i+step-1);
      if (error) throw error; out.push(...data); if (data.length < step) break;
    }
    return out;
  },
  async ins(t, rows, ignorarDup=false){
    rows = Array.isArray(rows) ? rows : [rows];
    if (DEMO){ const db=Local.load(); const res=[];
      for (const r of rows){
        if (ignorarDup && r.chave && db[t].some(x=>x.chave===r.chave)) continue;
        const n = t==='usuarios' ? {...r} : {id: db.seq++, criado_em:new Date().toISOString(), ...r};
        db[t].push(n); res.push(n); }
      Local.save(); return res; }
    let res=[];
    for (let i=0;i<rows.length;i+=500){
      const part = rows.slice(i,i+500);
      const q = ignorarDup ? sb.from(t).upsert(part,{onConflict:'chave', ignoreDuplicates:true}).select(COLS[t]||'*')
                           : sb.from(t).insert(part).select(COLS[t]||'*');
      const { data, error } = await q; if (error) throw error; res = res.concat(data||[]);
    }
    return res;
  },
  async upd(t, match, patch){
    if (DEMO){ const db=Local.load(); const [k,v]=Object.entries(match)[0];
      db[t].forEach(x=>{ if (x[k]===v) Object.assign(x, patch); }); Local.save(); return; }
    const { error } = await sb.from(t).update(patch).match(match); if (error) throw error;
  },
  async del(t, match){
    if (DEMO){ const db=Local.load(); const [k,v]=Object.entries(match)[0];
      db[t] = db[t].filter(x=>x[k]!==v); Local.save(); return; }
    const { error } = await sb.from(t).delete().match(match); if (error) throw error;
  }
};

/* ---------------- regra de mensalidade / atraso ---------------- */
// Soma tudo que o afiliado já pagou e compara com as competências vencidas desde o início.
// Pagamento maior que a mensalidade cobre os meses seguintes (e paga primeiro os mais antigos).
// 1 ou 2 meses sem pagar = "pendente" (amarelo). 3 ou mais = "em atraso" (vermelho).
function statusAf(a, hoje = new Date()){
  const pago = S.movimentos.filter(m => m.afiliado_id === a.id && m.valor > 0).reduce((s,m)=>s+m.valor,0);
  if (!a.ativo) return {k:'inativo', txt: a.desligado_motivo ? 'Desligado' : 'Inativo', pago};
  const v = a.valor_mensal;
  if (!(v > 0)) return {k:'livre', txt:'Sem valor fixo', pago};
  const [y0,m0] = (a.inicio || hojeISO()).split('-').map(Number);
  const h0 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const venc = (y,m) => new Date(y, m-1, Math.min(a.dia_vencimento||DIA_VENC_PADRAO, new Date(y, m, 0).getDate()));
  let y=y0, m=m0, vencidas=0;
  const ate = a.cobrar_ate ? a.cobrar_ate.slice(0,7) : null;
  while ((y < hoje.getFullYear() || (y===hoje.getFullYear() && m <= hoje.getMonth()+1)) && (!ate || `${y}-${String(m).padStart(2,'0')}` <= ate)) {
    if (venc(y,m) < h0) vencidas++;
    m++; if (m>12){m=1;y++;}
  }
  const cobertos = Math.floor((pago + 0.005) / v);
  const compN = n => { const t = (m0-1) + n; return {y: y0 + Math.floor(t/12), m: (t%12)+1}; };
  const pagoAte = cobertos > 0 ? compN(cobertos-1) : null;
  const deve = vencidas*v - pago;
  if (deve > 0.005) {
    const meses = Math.ceil(deve / v - 1e-9);
    if (meses >= MESES_ATRASO) return {k:'atraso', txt:`${meses} meses em atraso`, curto:`${meses} meses`, meses, deve, pago, pagoAte};
    return {k:'pendente', txt: meses===1 ? '1 mês pendente' : `${meses} meses pendentes`, curto: meses===1 ? '1 mês' : `${meses} meses`, meses, deve, pago, pagoAte};
  }
  const prox = compN(cobertos); const dv = venc(prox.y, prox.m);
  const dias = Math.round((dv - h0) / 864e5);
  if (dias <= 5) return {k:'vence', txt: dias<=0 ? 'Vence hoje' : `Vence em ${dias} dia${dias>1?'s':''}`, pago, pagoAte, prox:dv};
  return {k:'emdia', txt:'Em dia', pago, pagoAte, prox:dv};
}

// Situação mês a mês: os pagamentos quitam primeiro os meses mais antigos
function mesesAf(a, hoje = new Date()){
  const v = a.valor_mensal; if (!(v > 0) || !a.inicio) return [];
  const pago = S.movimentos.filter(m => m.afiliado_id === a.id && m.valor > 0).reduce((s,m)=>s+m.valor,0);
  const cob = Math.floor((pago + 0.005) / v);
  const [y0,m0] = a.inicio.split('-').map(Number);
  const h0 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  let fimN = Math.max((hoje.getFullYear()-y0)*12 + hoje.getMonth()+1 - m0, cob - 1);
  if (a.cobrar_ate){ const [ya,ma] = a.cobrar_ate.split('-').map(Number); fimN = Math.min(fimN, Math.max((ya-y0)*12 + ma - m0, cob - 1)); }
  const out = [];
  for (let n = 0; n <= fimN; n++){
    const t = (m0-1)+n, y = y0 + Math.floor(t/12), m = (t%12)+1;
    const venc = new Date(y, m-1, Math.min(a.dia_vencimento||DIA_VENC_PADRAO, new Date(y, m, 0).getDate()));
    out.push({ y, m, k: n < cob ? 'pago' : venc < h0 ? 'aberto' : 'avencer' });
  }
  return out;
}

        Endereço: r.endereco || a.endereco || '', CPF: fmtDoc(a.cpf), Camisa: r.tamanho_camisa || a.tamanho_camisa || '', Pagamento: r.forma_pagamento || '', 'Renovou em': fdata(r.criado_em), Obs: r.obs || '' }; })
      .sort((x,y) => (x.Nome||'').localeCompare(y.Nome||'', 'pt-BR'));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Renovados ' + ANO_RENOV);
    XLSX.writeFile(wb, `renovados-${ANO_RENOV}.xlsx`);
  } catch(e){ toast(erroMsg(e)); }
}

/* ---------------- categorias ---------------- */
const CAT_ENT = ['Mensalidade','Boletos (sem identificação)','Eventos / vendas','Doação avulsa','Cartão (maquininha)','Rendimentos','Outras entradas'];
const CAT_SAI = ['Tarifas bancárias','Contas (luz/água/internet)','Compras / mercado','Combustível','Eventos','Serviços / pessoas','Equipamentos','Aluguel / imóvel','Outras saídas'];
function catAuto(desc, nome, valor){
  const t = norm(desc + ' ' + (nome||''));
  if (valor > 0) {
    if (/RENDIMENTO/.test(t)) return 'Rendimentos';
    if (/REDECARD|RECEBIMENTO REDE|\bREDE\b/.test(t)) return 'Cartão (maquininha)';
    if (/BOLETO/.test(t)) return 'Boletos (sem identificação)';
    return 'Outras entradas';
  }
  if (/\bTAR\b|TARIFA|CUSTAS|SISDEB/.test(t)) return 'Tarifas bancárias';
  if (/CPFL|SAERP|ALARES|CONCESSIONARIA|SABESP|ENERGIA|TELEFON|INTERNET/.test(t)) return 'Contas (luz/água/internet)';
  if (/SUPERMERC|MERCADO|MERCEARIA|ATACA|EMPORIO|ARMAZEM|SALGADOS|BUFFET|PADARIA|ACOUGUE/.test(t)) return 'Compras / mercado';
  if (/PETRO|POSTO|COMBUST|AUTO POSTO/.test(t)) return 'Combustível';
  if (/IMOVEIS|ALUGUEL/.test(t)) return 'Aluguel / imóvel';
  return 'Outras saídas';
}

function telaLogin(modo='entrar', msg=''){
  $('#app').innerHTML = `
  <div class="login">
    <img src="logo.png" alt="Mastodonte">
    <div class="card">
      ${DEMO ? `<h1>Demonstração</h1><p>O app ainda não está ligado ao banco. Os dados ficam só neste aparelho.</p>
        <button class="btn acc wide" style="margin-top:12px" onclick="entrarDemo()">Entrar na demonstração</button>` : `
      <h1>${modo==='entrar'?'Entrar':modo==='criar'?'Primeiro acesso':'Recuperar senha'}</h1>
      <p>${modo==='entrar'?'Use o e-mail liberado pelo administrador.':modo==='criar'?'Seu e-mail precisa estar liberado pelo administrador. Crie sua senha.':'Enviaremos um link para criar uma nova senha.'}</p>
      <form class="f" id="fLogin" autocomplete="on">
        <label for="lEmail">E-mail</label>
        <input id="lEmail" name="email" type="email" autocomplete="username" required inputmode="email">
        ${modo!=='rec' ? `<label for="lSenha">Senha</label>
        <input id="lSenha" name="password" type="password" autocomplete="${modo==='criar'?'new-password':'current-password'}" required minlength="6">` : ''}
        <div class="err" id="lErr">${esc(msg)}</div>
        <button class="btn acc wide" type="submit" id="lBtn">${modo==='entrar'?'Entrar':modo==='criar'?'Criar minha senha':'Enviar link'}</button>
      </form>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        ${modo!=='entrar' ? `<button class="lnk" onclick="telaLogin('entrar')">← Voltar</button>` :
          `<button class="lnk" onclick="telaLogin('criar')">Primeiro acesso</button><button class="lnk" onclick="telaLogin('rec')">Esqueci a senha</button>`}
      </div>`}
    </div>
    <small style="opacity:.5;margin-top:18px">Mastodonte Gestão ${VERSAO}</small>
  </div>`;
  if (DEMO) return;
  $('#fLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    const email = $('#lEmail').value.trim().toLowerCase(), senha = $('#lSenha')?.value;
    const btn = $('#lBtn'); btn.disabled = true; $('#lErr').textContent = '';
    try {
      if (modo==='entrar'){
        const { error } = await sb.auth.signInWithPassword({ email, password: senha });
        if (error) throw new Error(/invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : /confirm/i.test(error.message) ? 'Confirme seu e-mail pelo link que chegou na caixa de entrada.' : error.message);
        await iniciar();
      } else if (modo==='criar'){
        const { data, error } = await sb.auth.signUp({ email, password: senha, options:{ emailRedirectTo: location.origin + location.pathname } });
        if (error) throw new Error(/permiss|Database error/i.test(error.message) ? 'Esse e-mail não está liberado. Peça ao administrador.' : error.message);
        if (data.session) await iniciar();
        else telaLogin('entrar', 'Conta criada! Abra o e-mail de confirmação e depois entre aqui.');
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        if (error) throw error;
        telaLogin('entrar', 'Link enviado. Confira seu e-mail.');
      }
    } catch(e){ $('#lErr').textContent = erroMsg(e); btn.disabled = false; }
  });
}

async function iniciar(){
  if (DEMO){ if (LS.get('masto_demo_on', false)) return entrarDemo(); return telaLogin(); }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  const email = session.user.email.toLowerCase();
  const { data: u } = await sb.from('usuarios').select('*').eq('email', email).maybeSingle();
  if (!u || !u.ativo){ await sb.auth.signOut(); return telaLogin('entrar', 'Seu acesso não está liberado. Fale com o administrador.'); }
  S.me = u; abrirApp();
}

  const cnt = k => all.filter(x => passa(x,k)).length;
  const q = norm(S.buscaAf), qd = dig(S.buscaAf);
  let lst = all.filter(x => passa(x, S.filtroAf));
  if (q) lst = lst.filter(x => norm(x.a.nome).includes(q) || (qd && (dig(x.a.cpf).includes(qd) || dig(x.a.telefone).includes(qd))));
  const ordem = {atraso:0, pendente:1, vence:2, emdia:3, livre:4, inativo:5};

    const valor = parseFloat(String(f.get('valor_mensal')).replace(/\./g,'').replace(',','.'));
    if (!(valor >= 0)) return $('#afErr').textContent = 'Informe o valor da doação.';
    const row = { nome: f.get('nome').trim(), cpf: doc || null, telefone: dig(f.get('telefone')) || null, endereco: f.get('endereco').trim() || null,
      valor_mensal: valor, dia_vencimento: Math.min(31, Math.max(1, +f.get('dia_vencimento')||DIA_VENC_PADRAO)),

      categoria: f.get('categoria') || 'contribuinte', tamanho_camisa: f.get('camisa') || null };
    const antes = id ? S.afiliados.find(x=>x.id===id) : null;
    const viraContribAtivo = row.ativo && row.categoria !== 'fundador' && !(antes && antes.ativo && antes.categoria !== 'fundador');
    if (viraContribAtivo && contribAtivos() >= LIMITE_CONTRIB) return $('#afErr').textContent = `Limite de ${LIMITE_CONTRIB} sócios contribuintes atingido (Art. 9º). Ele só pode ser aumentado em assembleia.`;
    if (doc && S.afiliados.some(x => x.id!==id && dig(x.cpf)===doc)) return $('#afErr').textContent = 'Já existe afiliado com esse CPF/CNPJ.';
    try {
      let novoId = id;
      if (id) await DB.upd('afiliados', {id}, row); else novoId = (await DB.ins('afiliados', row))[0]?.id;
      // vincula automaticamente entradas do extrato com o mesmo CPF que ainda não têm dono
      let vinc = 0;
      if (doc && novoId){
        const alvo = S.movimentos.filter(m => m.valor>0 && !m.afiliado_id && dig(m.documento)===doc);
        for (const m of alvo){ await DB.upd('movimentos', {id:m.id}, {afiliado_id:novoId, categoria:'Mensalidade'}); vinc++; }

      if (ft && novoId) { const path = await enviarFoto(ft, `afiliados/${novoId}`); await DB.upd('afiliados', {id:novoId}, {foto: path}); }
      await carregar('afiliados','movimentos'); fecharSheet();
      if (S.imp) { reclassificarImp(); }
      toast(id ? 'Afiliado atualizado' : 'Afiliado cadastrado' + (vinc ? ` · ${vinc} pagamento(s) do extrato vinculados` : ''));
      render();
    } catch(e){ $('#afErr').textContent = erroMsg(e); }
  });

async function enviarFoto(file, prefixo){
  if (DEMO) return null;
  const body = await reduzirImagem(file, 800);
  const path = `${prefixo}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('fotos').upload(path, body, { contentType: 'image/jpeg' });
  if (error) throw error; return path;
}
async function urlFoto(path){
  if (DEMO || !path) return null;
  const { data } = await sb.storage.from('fotos').createSignedUrl(path, 3600); return data?.signedUrl || null;
}

async function desligarNaoRenovados(){
  if (DEMO || !ehAdm()) return;
  const mesAtual = hojeISO().slice(0,7);
  const sair = S.afiliados.filter(a => a.ativo && a.cobrar_ate && a.cobrar_ate.slice(0,7) < mesAtual);
  if (!sair.length) return;
  for (const a of sair){
    const [y,m] = a.cobrar_ate.split('-').map(Number); const fim = new Date(y, m, 0);
    const iso = `${fim.getFullYear()}-${String(fim.getMonth()+1).padStart(2,'0')}-${String(fim.getDate()).padStart(2,'0')}`;
    await DB.upd('afiliados', {id:a.id}, { ativo:false, desligado_em: iso, desligado_motivo:'Desistência', desligado_obs:`Não renovou para ${ANO_RENOV} (avisou pela página do afiliado).` });
  }
  await carregar('afiliados'); toast(`${sair.length} afiliado${sair.length>1?'s':''} que não renovaram foram desligados`, 4000);
}
async function reativarAf(id){
  const a = S.afiliados.find(x=>x.id===id); const mot = a.desligado_motivo;
  // Art. 16 do estatuto
  if ((a.readmissoes||0) >= 1 && (mot === 'Falta de pagamento' || mot === 'Desistência'))
    return confirmar('Readmissão não permitida', 'Pelo Art. 16 do estatuto, o sócio só pode ser readmitido uma única vez, e ele já foi readmitido antes.', 'Entendi');
  if (mot === 'Falta de pagamento'){
    const anoDes = (a.desligado_em||'').slice(0,4);
    if (anoDes && anoDes !== String(new Date().getFullYear()))
      return confirmar('Readmissão não permitida', `Pelo Art. 16, I, quem foi desligado por falta de pagamento só pode ser readmitido no mesmo ano do desligamento (${anoDes}).`, 'Entendi');
    const s = statusAf({...a, ativo:true});
    if (temDivida(s))
      return confirmar('Falta quitar as mensalidades', `Pelo Art. 16, I, para ser readmitido ele precisa quitar todo o período em atraso: ${brl(s.deve)}. Registre o pagamento na ficha dele e depois reative.`, 'Entendi');
  }
  if (mot === 'Impedimento pelo estatuto')
    return confirmar('Readmissão não permitida', 'O estatuto não prevê readmissão para desligamento por impedimento (Art. 16 e 17). Se for um caso especial, a decisão é da Diretoria; fale comigo para ajustar.', 'Entendi');
  if (a.categoria !== 'fundador' && contribAtivos() >= LIMITE_CONTRIB)
    return confirmar('Limite de sócios atingido', `Já há ${LIMITE_CONTRIB} sócios contribuintes ativos (Art. 9º).`, 'Entendi');
  const aviso = mot ? 'Pelo estatuto, a readmissão é a juízo da Diretoria e só pode acontecer uma única vez.' : 'Ele volta para a lista de ativos e passa a ser cobrado de novo.';
  if (!(await confirmar('Reativar este afiliado?', aviso, 'Reativar'))) return;
  try { await DB.upd('afiliados', {id}, { ativo:true, desligado_em:null, desligado_motivo:null, desligado_obs:null, readmissoes: (a.readmissoes||0) + (mot ? 1 : 0) });
    await carregar('afiliados'); toast('Afiliado reativado'); render(); abrirAf(id); } catch(e){ toast(erroMsg(e)); }
}

// n-ésimo dia da semana do mês (n = 1..4, ou 5 = último)
function diaDoMes(ano, mes, diaSem, n){
  if (n === 5){ const d = new Date(ano, mes, 0); while (d.getDay() !== diaSem) d.setDate(d.getDate()-1); return d; }
  const d = new Date(ano, mes-1, 1); while (d.getDay() !== diaSem) d.setDate(d.getDate()+1); d.setDate(d.getDate() + 7*(n-1)); return d;
}

      10:'Edital de convocação (5 dias antes, Art. 31) e relação dos sócios com direito a voto (Art. 32)',
      11:`Aprovação das contribuições mensais de ${ano+1} (Art. 18) e do Plano Anual ${ano+1} para o Conselho Fiscal (Art. 38)`, 12:'Fechamento do ano e prestação de contas' };
    const rows = [];
    for (let m = 1; m <= 12; m++){
      rows.push({ data: isoD(diaDoMes(ano, m, dia, n)), hora, local, tipo:'diretoria', titulo:`Reunião ordinária da Diretoria · ${MESES_L[m-1]}`,

    try { await DB.ins('reunioes', rows); await carregar('reunioes'); fecharSheet(); S.agAno = ano; toast(`${rows.length} reuniões criadas`); vAgenda(); }
    catch(e){ $('#gErr').textContent = erroMsg(e); }
  });
}

function convocacao(r){

  return `🦣 *Associação Mastodonte*\n*${r.titulo}*\n\n📅 ${dsem}, ${fdata(r.data)}${r.hora?' às '+r.hora:''}\n${r.local?'📍 '+r.local+'\n':''}${r.pauta?'\n*Pauta:*\n'+r.pauta+'\n':''}\nContamos com a sua presença!`;
}
function baixarIcs(id){
  const r = S.reunioes.find(x=>x.id===id); const [hh,mm] = (r.hora||'19:00').match(/\d+/g) || ['19','00'];
  const ini = r.data.replace(/-/g,'') + 'T' + String(hh).padStart(2,'0') + String(mm||'00').padStart(2,'0') + '00';
  const fimH = String((+hh+2)%24).padStart(2,'0');
  const fim = r.data.replace(/-/g,'') + 'T' + fimH + String(mm||'00').padStart(2,'0') + '00';
  const escI = t => String(t||'').replace(/[\\,;]/g, m=>'\\'+m).replace(/\n/g,'\\n');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mastodonte//Agenda//PT','BEGIN:VEVENT',`UID:reuniao-${id}@mastodonte`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
    `DTSTART;TZID=America/Sao_Paulo:${ini}`,`DTEND;TZID=America/Sao_Paulo:${fim}`,`SUMMARY:${escI(r.titulo)}`,`LOCATION:${escI(r.local)}`,`DESCRIPTION:${escI(r.pauta)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'})); a.download = `reuniao-${r.data}.ics`; a.click();
}
async function excluirReuniao(id){

const SECOES_PLANO = [

  ['eventos', 'Eventos', 'Art. 38, III: eventos a serem realizados'],

  ['orcamento', 'Outras receitas e despesas previstas', 'Art. 25, VIII: itens do orçamento que não estão acima'] ];
const ST_PLANO = { planejado:['Planejado','b-mute'], andamento:['Em andamento','b-vence'], concluido:['Concluído','b-emdia'], cancelado:['Cancelado','b-mute'] };
function vPlano(){
  const anos = [...new Set([new Date().getFullYear(), 2027, ...S.planejamento.map(p=>p.ano)])].sort();
  S.plAno = S.plAno || 2027;
  const its = S.planejamento.filter(p=>p.ano===S.plAno);
  const ok = its.filter(p=>p.status==='concluido').length, ativos = its.filter(p=>p.status!=='cancelado');
  const rec = ativos.filter(p=>p.tipo==='receita').reduce((s,p)=>s+Number(p.valor||0),0);
  const desp = ativos.filter(p=>p.tipo==='despesa').reduce((s,p)=>s+Number(p.valor||0),0);
  const nMens = S.afiliados.filter(a=>a.ativo && !naoRenova(a)).length, prevMens = nMens * MENSALIDADE_PADRAO * 12;
  const temMens = its.some(p=>p.tipo==='receita' && p.categoria==='Mensalidade');
  // previsto x realizado por categoria
  const cats = {}; ativos.filter(p=>p.tipo && p.categoria).forEach(p => { const k = p.tipo+'|'+p.categoria; cats[k] = (cats[k]||0) + Number(p.valor||0); });
  const real = (tipo, cat) => S.movimentos.filter(m => m.data.startsWith(String(S.plAno)) && (tipo==='receita' ? m.valor>0 : m.valor<0) &&
      (cat==='Mensalidade' ? (m.afiliado_id || m.categoria==='Mensalidade' || m.categoria==='Boletos (sem identificação)') : m.categoria===cat)).reduce((s,m)=>s+Math.abs(m.valor),0);
  const item = p => `<div class="li" onclick="formPlano(${p.id})" style="${p.status==='cancelado'?'opacity:.5':''}"><div class="grow">
      <div class="t">${esc(p.titulo)}</div><div class="s">${[p.mes?MESES_L[p.mes-1]:'', p.responsavel, p.valor?(p.tipo==='receita'?'+ ':'− ')+brl(p.valor):''].filter(Boolean).map(esc).join(' · ')||'—'}</div></div>
      <span class="badge ${ST_PLANO[p.status][1]}">${ST_PLANO[p.status][0]}</span></div>`;
  $('#view').innerHTML = `
    <div class="chips">${anos.map(a=>`<button class="chip ${a===S.plAno?'on':''}" onclick="S.plAno=${a};vPlano()">${a}</button>`).join('')}</div>
    <div class="card" style="margin-top:12px"><div class="row"><div class="grow"><b>Plano Anual ${S.plAno}</b>
      <div class="muted">${its.length ? `${ok} de ${its.length} itens concluídos` : 'Ainda sem itens'} · apresentado ao Conselho Fiscal na reunião de novembro (Art. 38)</div></div></div>
      ${its.length?`<div class="bars" style="margin-top:8px"><div class="bt"><div class="bf" style="width:${(ok/its.length*100).toFixed(1)}%;background:var(--ok)"></div></div></div>
      <div class="row" style="margin-top:10px"><button class="btn sm ghost grow" onclick="copiarPlano()">Copiar plano</button><button class="btn sm ghost grow" onclick="baixarPlano()">Baixar planilha</button></div>`:''}</div>
    <div class="sec-h"><h2>Orçamento ${S.plAno}</h2></div>
    <div class="kpis"><div class="card kpi ok"><small>Receitas previstas</small><b class="val">${brl(rec)}</b></div><div class="card kpi"><small>Despesas previstas</small><b class="val neg">${brl(desp)}</b></div></div>
    <div class="card kpi" style="margin-top:10px"><small>Saldo previsto</small><b class="val ${rec-desp>=0?'pos':'neg'}">${brl(rec-desp)}</b></div>
    ${!temMens && nMens ? `<div class="card" style="margin-top:10px;background:var(--accent-soft);border:0"><b>Mensalidades previstas: ${brl(prevMens)}</b>
      <div class="muted">${nMens} afiliados × ${brl(MENSALIDADE_PADRAO)} × 12 meses${S.afiliados.some(a=>a.ativo&&naoRenova(a))?' (sem contar quem não vai renovar)':''}</div>
      <button class="btn sm acc" style="margin-top:8px" onclick="addMensPlano(${prevMens}, ${nMens})">Adicionar ao orçamento</button></div>` : ''}
    ${Object.keys(cats).length ? `<div class="card" style="margin-top:10px"><b>Previsto × realizado</b>
      ${Object.entries(cats).map(([k,v])=>{ const [t,c] = k.split('|'); const r = real(t,c); const pct = v ? Math.min(100, r/v*100) : 0;
        return `<div class="bars" style="margin-top:10px"><div class="bl"><span>${t==='receita'?'⬆':'⬇'} ${esc(c)}</span><span class="val">${brl(r)} de ${brl(v)}</span></div>
          <div class="bt"><div class="bf" style="width:${pct.toFixed(1)}%;background:${t==='receita'?'var(--ok)':(r>v?'var(--bad)':'var(--accent)')}"></div></div></div>`; }).join('')}</div>` : ''}
    ${SECOES_PLANO.map(([k,n,d])=>{ const l = its.filter(p=>p.secao===k).sort((a,b)=>(a.mes||13)-(b.mes||13));
      return `<div class="sec-h"><div><h2 style="font-size:18px">${n}</h2><div class="muted" style="font-size:13px">${d}</div></div><button class="btn sm ghost" onclick="formPlano(null,'${k}')">${IC.plus}</button></div>
        ${l.length ? `<div class="list">${l.map(item).join('')}</div>` : `<div class="card empty" style="padding:14px">Nenhum item.</div>`}`; }).join('')}`;
  fab('formPlano()');

    const row = { ano: p.ano || S.plAno, secao:f.get('secao'), titulo:f.get('titulo').trim(), descricao:f.get('descricao').trim()||null, mes: f.get('mes') ? +f.get('mes') : null,

function textoPlano(){
  const its = S.planejamento.filter(p=>p.ano===S.plAno && p.status!=='cancelado');
  const rec = its.filter(p=>p.tipo==='receita').reduce((s,p)=>s+Number(p.valor||0),0), desp = its.filter(p=>p.tipo==='despesa').reduce((s,p)=>s+Number(p.valor||0),0);
  return `ASSOCIAÇÃO MASTODONTE\nPLANO ANUAL ${S.plAno} (Art. 38 do estatuto)\n` +
    SECOES_PLANO.map(([k,n]) => { const l = its.filter(p=>p.secao===k); if (!l.length) return '';
      return `\n${n.toUpperCase()}\n` + l.map(p=>`• ${p.titulo}${p.mes?' ('+MESES_L[p.mes-1]+')':''}${p.valor?' — '+(p.tipo==='receita'?'receita ':'despesa ')+brl(p.valor):''}${p.descricao?'\n  '+p.descricao:''}`).join('\n'); }).join('\n') +
    `\n\nORÇAMENTO PREVISTO\nReceitas: ${brl(rec)}\nDespesas: ${brl(desp)}\nSaldo: ${brl(rec-desp)}`;
}

async function baixarPlano(){

const pastaApp = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const linkMatricula = () => pastaApp() + 'matricula.html';
const imgAluno = a => a.imagem_autorizada === true ? ['📷 imagem autorizada','b-emdia'] : a.imagem_autorizada === false ? ['🚫 sem uso de imagem','b-vence'] : ['imagem: sem resposta','b-mute'];

      <div class="g2" style="margin-top:12px"><button class="btn acc" onclick="enviarLinkMatricula()">${IC.wa} Enviar no WhatsApp</button><button class="btn ghost" onclick="copiarLinkMatricula()">Copiar link</button></div>

    <div class="row" style="margin-top:10px"><input id="escBusca" class="grow" placeholder="Buscar aluno, responsável ou turma" value="${esc(S.escBusca||'')}" style="height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font:inherit;color:var(--ink)">

    <div id="escLista" style="margin-top:10px"></div>`;
  $('#escBusca').oninput = e => { S.escBusca = e.target.value; listaAlunos(f); };
  listaAlunos(f);
  fab('formAluno()');

function listaAlunos(f){
  const b = (S.escBusca||'').toLowerCase().trim();
  const lst = S.alunos.filter(a=>a.status===f && (!b || [a.nome,a.responsavel_nome,a.turma,a.instrumento].join(' ').toLowerCase().includes(b)))
    .sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR'));
  $('#escLista').innerHTML = lst.length ? `<div class="list">${lst.map(a=>{ const [txt,cls] = imgAluno(a); const id = idade(a.nascimento);
    return `<div class="li" onclick="abrirAluno(${a.id})"><div class="avatar">${esc(iniciais(a.nome))}</div><div class="grow"><div class="t">${esc(a.nome)}</div>
      <div class="s">${[id!==null?id+' anos':'', a.instrumento, a.turma].filter(Boolean).map(esc).join(' · ') || '—'}</div></div>
      <span class="badge ${cls}" style="font-size:12px">${txt.split(' ')[0]}</span></div>`; }).join('')}</div>`
    : `<div class="card empty">${f==='pendente' ? 'Nenhuma matrícula aguardando aprovação.' : b ? 'Ninguém encontrado.' : 'Nenhum aluno aqui ainda.'}</div>`;
}
async function copiarLinkMatricula(){
  try { await navigator.clipboard.writeText(linkMatricula()); toast('Link copiado'); } catch(e){ prompt('Copie o link:', linkMatricula()); } }
function enviarLinkMatricula(){
  const msg = `Olá! Aqui é da Associação Mastodonte 🦣🎵\nPara matricular seu filho(a) na Escola de Música, preencha a ficha neste link (leva uns 3 minutos). Nela também está o termo de uso de imagem, que é gratuito e opcional:\n${linkMatricula()}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank'); }
function formAluno(id){
  const a = id ? S.alunos.find(x=>x.id===id) : { status:'ativo' };
  const imgAtual = a.imagem_autorizada === true ? 'sim' : a.imagem_autorizada === false ? 'nao' : '';
  const turmas = [...new Set(S.alunos.map(x=>x.turma).filter(Boolean))];
  abrirSheet(`<h3>${id?'Editar aluno':'Novo aluno'}</h3>
  <form class="f" id="fAl">
    <label>Nome do aluno *</label><input name="nome" required value="${esc(a.nome)}" autocomplete="off">

    <div class="g2"><div><label>Turma / horário</label><input name="turma" list="turL" value="${esc(a.turma)}" placeholder="Ex.: Sábado 9h"></div>

    <datalist id="turL">${turmas.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist>

    <div class="sec-h" style="margin-top:14px"><h2 style="font-size:17px">Responsável</h2></div>
    <label>Nome *</label><input name="rnome" required value="${esc(a.responsavel_nome)}">
    <div class="g2"><div><label>CPF</label><input name="rcpf" inputmode="numeric" value="${esc(fmtDoc(a.responsavel_cpf||''))}" placeholder="000.000.000-00"></div>
    <div><label>Parentesco</label><input name="rpar" list="parL" value="${esc(a.responsavel_parentesco)}"></div></div>
    <datalist id="parL">${['Mãe','Pai','Avó/Avô','Tio(a)','Tutor(a) / guardião legal'].map(x=>`<option>${x}</option>`).join('')}</datalist>
    <div class="g2"><div><label>Telefone (WhatsApp) *</label><input name="rtel" inputmode="tel" required value="${esc(fmtTel(a.responsavel_telefone||''))}"></div>
    <div><label>E-mail</label><input name="remail" type="email" value="${esc(a.responsavel_email)}"></div></div>
    <label>Endereço</label><input name="end" value="${esc(a.endereco)}">
    <div class="sec-h" style="margin-top:14px"><h2 style="font-size:17px">Uso de imagem</h2></div>
    ${a.imagem_aceite_em ? `<p class="muted" style="margin:0 0 6px">Registrado em ${new Date(a.imagem_aceite_em).toLocaleString('pt-BR')} · ${esc(a.imagem_aceite_forma||'')}${a.imagem_revogada_em?' · cancelado em '+fdata(a.imagem_revogada_em):''}</p>` : ''}
    <select name="img"><option value="" ${!imgAtual?'selected':''}>Ainda sem resposta</option>
      <option value="sim" ${imgAtual==='sim'?'selected':''}>Autorizado (termo em papel assinado)</option>
      <option value="nao" ${imgAtual==='nao'?'selected':''}>Não autorizado</option></select>
    <div class="muted" style="margin-top:4px">Só marque "Autorizado" com o termo assinado pelo responsável em mãos (ou use o link, que registra o aceite).</div>
    <label>Observações internas</label><textarea name="obs">${esc(a.obs)}</textarea>
    <div class="err" id="alErr"></div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn ghost grow" onclick="${id?`abrirAluno(${id})`:'fecharSheet()'}">Cancelar</button><button class="btn acc grow">Salvar</button></div>
  </form>`);
  $('#fAl').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = new FormData(ev.target), err = $('#alErr');
    const cpf = dig(f.get('rcpf')); if (cpf && !cpfOk(cpf)) return err.textContent = 'CPF do responsável inválido.';
    if (dig(f.get('rtel')).length < 10) return err.textContent = 'Informe o telefone do responsável com DDD.';
    const row = { nome: f.get('nome').trim(), nascimento: f.get('nasc') || null, instrumento: f.get('inst').trim() || null, turma: f.get('turma').trim() || null,
      status: f.get('status'), cuidados: f.get('cuid').trim() || null, responsavel_nome: f.get('rnome').trim(), responsavel_cpf: cpf || null,
      responsavel_parentesco: f.get('rpar').trim() || null, responsavel_telefone: dig(f.get('rtel')), responsavel_email: f.get('remail').trim() || null,
      endereco: f.get('end').trim() || null, obs: f.get('obs').trim() || null };

      else Object.assign(row, { imagem_autorizada: null });
    }
    const id18 = idade(row.nascimento);
    if (id18 !== null && (id18 < 8 || id18 > 16) && !await confirmar(`O aluno tem ${id18} anos`, 'A escola atende de 8 a 16 anos. Salvar mesmo assim?', 'Salvar')) return;
    try { let nid = id; if (id) await DB.upd('alunos',{id},row); else nid = (await DB.ins('alunos',{...row, origem:'app'}))[0].id;
      await carregar('alunos'); toast('Aluno salvo'); render(); abrirAluno(nid); } catch(e){ err.textContent = erroMsg(e); }
  });
}

}
async function statusAluno(id, st){
  try { await DB.upd('alunos',{id},{status:st}); await carregar('alunos'); toast(st==='ativo'?'Matrícula ativa':'Aluno inativo'); render(); abrirAluno(id); } catch(e){ toast(erroMsg(e)); } }
async function revogarImagem(id){
  if (!await confirmar('Cancelar a autorização de imagem?', 'A partir de agora não publique fotos ou vídeos deste aluno e retire as publicações digitais da associação quando possível.', 'Cancelar autorização')) return abrirAluno(id);
  try { await DB.upd('alunos',{id},{imagem_autorizada:false, imagem_revogada_em:new Date().toISOString()}); await carregar('alunos'); toast('Autorização cancelada'); render(); abrirAluno(id); } catch(e){ toast(erroMsg(e)); } }
async function excluirAluno(id){
  if (!await confirmar('Excluir este aluno?', 'O cadastro e o registro do termo de imagem serão apagados. Para guardar o histórico, prefira "Desativar".')) return abrirAluno(id);
  try { await DB.del('alunos',{id}); await carregar('alunos'); fecharSheet(); toast('Aluno excluído'); render(); } catch(e){ toast(erroMsg(e)); } }
async function baixarAlunos(){

/* =====================================================================
   ASSEMBLEIA — LISTA DE SÓCIOS COM DIREITO A VOTO (Art. 29 e 32)
   ===================================================================== */
function vVotantes(){
  const ativos = S.afiliados.filter(a=>a.ativo).map(a=>({a, s:statusAf(a)}));
  const quites = ativos.filter(x=>!temDivida(x.s)).map(x=>x.a).sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR'));
  const fora = ativos.length - quites.length;
  const hoje = new Date().toLocaleDateString('pt-BR');
  window._votTexto = `ASSOCIAÇÃO MASTODONTE\nRelação nominal dos sócios com direito a voto (Art. 32 do estatuto)\nAtualizada em ${hoje}\n\n` +
    quites.map((a,i)=>`${i+1}. ${a.nome}`).join('\n') +
    `\n\nQuem não está na relação por débito com a Tesouraria pode regularizar a situação até 24 horas antes da Assembleia (Art. 32, parágrafo único).`;
  $('#view').innerHTML = `
    <button class="btn ghost sm" onclick="ir('mais')">‹ Voltar</button>
    <div class="sec-h"><h2>Sócios com direito a voto</h2><span class="badge b-emdia">${quites.length}</span></div>
    <div class="card"><p class="muted" style="margin:0">O Art. 32 manda publicar esta relação nos 5 dias antes da Assembleia. Ela traz <b>só os nomes de quem está quite</b> (${quites.length}), sem CPF e sem citar quem deve. ${fora} sócio${fora!==1?'s':''} com mensalidade em aberto fica${fora!==1?'m':''} de fora e pode${fora!==1?'m':''} regularizar até 24 h antes.</p>
      <p class="muted" style="margin:8px 0 0">O estatuto também exige ser maior de 18 anos para votar (Art. 29). Confira isso na hora da assinatura da lista de presença.</p>
      <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn acc grow" onclick="copiarVotantes()">Copiar lista</button><button class="btn ghost grow" onclick="baixarVotantes()">Baixar planilha</button></div></div>
    <div class="list" style="margin-top:12px">${quites.map((a,i)=>`<div class="li" style="cursor:default"><span class="muted" style="width:28px">${i+1}</span><div class="grow"><div class="t">${esc(a.nome)}</div></div>${a.categoria==='fundador'?'<span class="badge b-acc">fundador</span>':''}</div>`).join('')}</div>`;
}
async function copiarVotantes(){
  try { await navigator.clipboard.writeText(window._votTexto); toast('Lista copiada. Cole no grupo ou no edital.'); }
  catch(e){ prompt('Copie a lista:', window._votTexto); }
}
async function baixarVotantes(){
  try { if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const quites = S.afiliados.filter(a=>a.ativo && !temDivida(statusAf(a))).sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR'));

    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(quites.map((a,i)=>({ 'Nº': i+1, Nome: a.nome, Categoria: a.categoria==='fundador'?'Fundador':'Contribuinte', Assinatura: '' }))), 'Direito a voto');

  } catch(e){ toast(erroMsg(e)); }

async function abrirDoc(id){
  const d = S.documentos.find(x=>x.id===id); if (!d) return;
  const w = window.open('', '_blank');

  if (error || !data){ if (w) w.close(); return toast('Não foi possível abrir o arquivo agora.'); }
  if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
}

const diretoria = () => S.usuarios.filter(u => u.ativo && u.papel === 'adm');

function placar(id){ const v = votosDe(id); const sim = v.filter(x=>x.voto==='sim').length, nao = v.filter(x=>x.voto==='nao').length;
  return { sim, nao, total: v.length, nec: votosNec(), meu: v.find(x => x.email === meuEmail()) }; }
const faltaMeuVoto = i => i.status === 'pendente' && !placar(i.id).meu;

async function votar(id, voto){
  const com = ($('#fVoto [name=com]')?.value || '').trim() || null;
  const meu = placar(id).meu;
  try {
    if (DEMO){ const db = Local.load(); db.indicacao_votos = db.indicacao_votos || []; const ex = db.indicacao_votos.find(v=>v.indicacao_id===id && v.email===meuEmail());
      if (ex) Object.assign(ex, {voto, comentario:com}); else db.indicacao_votos.push({id: db.seq++, indicacao_id:id, email:meuEmail(), voto, comentario:com, criado_em:new Date().toISOString()}); Local.save(); }
    else if (meu) await DB.upd('indicacao_votos', {id: meu.id}, { voto, comentario: com });
    else await DB.ins('indicacao_votos', { indicacao_id: id, email: meuEmail(), voto, comentario: com });
    await carregar('indicacao_votos'); toast(voto==='sim' ? 'Voto “Sim” registrado' : 'Voto “Não” registrado'); render(); abrirIndicacao(id);
  } catch(e){ toast(erroMsg(e)); }
}
async function aprovarIndicacao(id){
  const i = S.indicacoes.find(x=>x.id===id);
  if (S.afiliados.some(a=>dig(a.cpf)===dig(i.cpf))) return toast('Já existe um afiliado com esse CPF.');
  { const p = placar(id); if (p.sim < p.nec) return confirmar('Ainda sem maioria', `A indicação precisa de ${p.nec} votos “Sim” da diretoria. Agora tem ${p.sim}.`, 'Entendi'); }
  if (contribAtivos() >= LIMITE_CONTRIB) return confirmar('Limite de sócios atingido', `Já há ${LIMITE_CONTRIB} sócios contribuintes ativos. Pelo Art. 9º, esse número só pode ser aumentado em assembleia.`, 'Entendi');
  if (i.nascimento && idade(i.nascimento) < 18) return confirmar('Menor de 18 anos', 'Pelo Art. 15, II, só pode ser admitido quem é maior de 18 anos (ou emancipado legalmente).', 'Entendi');

  try {

    await DB.upd('indicacoes', {id}, { status:'aprovada', afiliado_id: novo?.id || null });

async function recusarIndicacao(id){

function vFinanceiro(){
  const mes = S.mesFin;
  const doMes = S.movimentos.filter(m=>m.valor && (mes==='tudo' || m.data.startsWith(mes)));
  const ent = doMes.filter(m=>m.valor>0), sai = doMes.filter(m=>m.valor<0);
  const tE = ent.reduce((s,m)=>s+m.valor,0), tS = sai.reduce((s,m)=>s-m.valor,0);

/* ---------- comprovantes ---------- */
function reduzirImagem(file, max=1600){
  return new Promise(ok => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); ok(b || file); }, 'image/jpeg', 0.82); };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); }; img.src = url; });
}
const arquivosMov = m => [...new Set([m.comprovante, ...(m.anexos||[])].filter(Boolean))];
async function enviarComprovantes(movId, files, atuais){
  if (DEMO) return toast('No modo demonstração os comprovantes não são guardados.');
  const novos = [];
  for (const f of files) novos.push(await enviarArquivo(movId, f));
  await DB.upd('movimentos', {id: movId}, { anexos: [...atuais, ...novos] });
}
async function enviarArquivo(movId, file){
  let body = file, tipo = file.type || 'application/octet-stream', ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  if (/^image\//.test(tipo) && !/gif/.test(tipo)) { body = await reduzirImagem(file); tipo = 'image/jpeg'; ext = 'jpg'; }
  if (body.size > 10*1024*1024) throw new Error('O arquivo passa de 10 MB. Tire uma foto em vez de enviar o arquivo original.');
  const path = `${movId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const { error } = await sb.storage.from('comprovantes').upload(path, body, { contentType: tipo });
  if (error) throw error;
  return path;
}
async function mostrarComprovante(m, box){
  const arqs = arquivosMov(m);
  try {
    const { data, error } = await sb.storage.from('comprovantes').createSignedUrls(arqs, 3600);
    if (error) throw error; if (!box.isConnected) return;
    box.innerHTML = arqs.map((p, i) => { const url = data[i]?.signedUrl; const pdf = /\.pdf$/i.test(p);
      const rem = ehAdm() ? `<button type="button" class="btn sm danger" style="flex:none" aria-label="Remover comprovante" onclick="removerAnexo(${m.id},'${esc(p)}')">✕</button>` : '';
      if (!url) return '';
      return pdf
        ? `<div class="row" style="margin-top:8px"><a class="btn ghost grow" style="text-decoration:none;justify-content:flex-start" href="${url}" target="_blank" rel="noopener">📄 Comprovante em PDF ${arqs.length>1?i+1:''}</a>${rem}</div>`
        : `<div style="position:relative;margin-top:8px"><a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Comprovante ${i+1}" style="width:100%;max-height:320px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:var(--bg)"></a>
           ${rem ? `<div style="position:absolute;top:8px;right:8px">${rem}</div>` : ''}</div>`; }).join('')
      + `<div class="muted" style="margin-top:6px">Toque no comprovante para ver em tamanho real.</div>`;
  } catch(e){ box.innerHTML = `<div class="muted">Não foi possível abrir os comprovantes agora.</div>`; }
}
async function removerAnexo(movId, path){
  if (!(await confirmar('Remover este comprovante?', 'O arquivo será apagado. Os outros comprovantes deste lançamento continuam.', 'Remover'))) return;
  const m = S.movimentos.find(x=>x.id===movId);
  try {
    const patch = { anexos: (m.anexos||[]).filter(p => p !== path) };
    if (m.comprovante === path) patch.comprovante = null;
    await DB.upd('movimentos', {id: movId}, patch);
    await sb.storage.from('comprovantes').remove([path]);
    await carregar('movimentos'); toast('Comprovante removido'); formMov(movId); render();
  } catch(e){ toast(erroMsg(e)); }
}
async function excluirMov(id){
  const m = S.movimentos.find(x=>x.id===id);
  const ok = await confirmar('Excluir este lançamento?', m.origem==='extrato' ? 'Se você importar o mesmo extrato de novo, ele volta.' : 'Essa ação não pode ser desfeita.');
  if (!ok) return;
  try { await DB.del('movimentos',{id}); await carregar('movimentos'); fecharSheet(); toast('Lançamento excluído'); render(); } catch(e){ toast(erroMsg(e)); }
}
// Divide uma entrada (ex.: boletos do dia somados) entre vários afiliados, sem mudar o total do caixa.
function distribuir(id){
  const m = S.movimentos.find(x=>x.id===id);
  const ops = S.afiliados.filter(a=>a.ativo).sort((a,b)=>a.nome.localeCompare(b.nome));
  abrirSheet(`<h3>Dar baixa em afiliados</h3><p class="muted">${fdata(m.data)} · ${esc(m.descricao)} · total <b class="val">${brl(m.valor)}</b></p>
  <div id="dLinhas"></div>
  <button class="btn ghost sm" style="margin-top:8px" onclick="dAdd()">${IC.plus} Adicionar afiliado</button>
  <p class="muted" id="dRes" style="margin-top:10px"></p>
  <div class="err" id="dErr"></div>
  <div class="row" style="margin-top:8px"><button class="btn ghost grow" onclick="formMov(${id})">Voltar</button><button class="btn acc grow" onclick="dSalvar(${id})">Confirmar baixa</button></div>`);
  window._dOps = ops; window._dTot = m.valor; dAdd();
}
function dAdd(){
  const d = document.createElement('div'); d.className='row f'; d.style.marginTop='8px';
  d.innerHTML = `<select class="grow" style="min-width:0">${'<option value="">Escolha o afiliado…</option>'+window._dOps.map(a=>`<option value="${a.id}" data-v="${a.valor_mensal}">${esc(a.nome)}</option>`).join('')}</select>
    <input inputmode="decimal" placeholder="valor" style="width:100px;flex:none">`;
  const [sel, inp] = d.children;
  sel.onchange = () => { if (!inp.value) inp.value = String(sel.selectedOptions[0].dataset.v||'').replace('.',','); dRes(); };
  inp.oninput = dRes; $('#dLinhas').appendChild(d);
}
function dLer(){ return [...$('#dLinhas').children].map(d=>({ af:+d.children[0].value, v: parseFloat((d.children[1].value||'').replace(/\./g,'').replace(',','.'))||0 })).filter(x=>x.af && x.v>0); }
function dRes(){ const l=dLer(); const s=l.reduce((a,x)=>a+x.v,0); const r=window._dTot-s;
  $('#dRes').innerHTML = `Distribuído <b class="val">${brl(s)}</b> · ${r>=-0.005 ? `sobra <b class="val">${brl(r)}</b> sem dono` : `<span class="neg">passou ${brl(-r)} do total</span>`}`; }
async function dSalvar(id){
  const m = S.movimentos.find(x=>x.id===id); const l = dLer(); const s = l.reduce((a,x)=>a+x.v,0);
  if (!l.length) return $('#dErr').textContent='Escolha pelo menos um afiliado.';
  if (s - m.valor > 0.005) return $('#dErr').textContent='A soma passou do valor do lançamento.';
  try {
    const filhos = l.map((x,i)=>({ data:m.data, descricao:m.descricao, nome:S.afiliados.find(a=>a.id===x.af).nome, documento:null, valor:x.v,
      categoria:'Mensalidade', afiliado_id:x.af, origem:m.origem, chave: m.chave ? `${m.chave}#${Date.now()}-${i}` : null }));
    await DB.ins('movimentos', filhos);
    await DB.upd('movimentos', {id}, { valor: Math.round((m.valor - s)*100)/100 }); // linha original fica com a sobra (0 some das listas, mas segura a chave contra reimportação)
    await carregar('movimentos'); fecharSheet(); toast(`Baixa feita para ${l.length} afiliado(s)`); render();
  } catch(e){ $('#dErr').textContent = erroMsg(e); }
}

      <div class="s">${esc([e.hora,e.local].filter(Boolean).join(' · ')) || '—'}${t.length?` · tarefas ${ok}/${t.length}`:''}${gasto?` · <span class="val">gasto ${brl(gasto)}</span>`:''}</div></div>
      <span class="badge ${e.status==='cancelado'?'b-mute':e.status==='realizado'?'b-emdia':'b-acc'}">${esc(e.status)}</span></div>`; };

}
function formEvento(id){
  const e = id ? S.eventos.find(x=>x.id===id) : {status:'planejado'};
  abrirSheet(`<h3>${id?'Editar evento':'Novo evento'}</h3>

/* ---------- planejamento do evento ---------- */
const CAT_EV = ['Estrutura / locação','Shows / bandas','Som e iluminação','Bar / bebidas','Alimentação','Divulgação','Equipe / segurança','Taxas / licenças','Outros'];
const CAT_EV_ENT = ['Ingressos','Patrocínio','Vendas do bar'];
const MARGENS = [0.10, 0.15, 0.20, 0.25, 0.30];
const num = s => parseFloat(String(s ?? '').replace(/\s|R\$/g,'').replace(/\./g,'').replace(',','.')) || 0;
const valTxt = v => Number(v) ? String(v).replace('.',',') : '';
function catsEvento(eid, cur){
  const extra = S.custos.filter(c=>c.evento_id===eid).map(c=>c.categoria);
  return [...new Set([...CAT_EV, ...CAT_EV_ENT, ...extra, ...(cur?[cur]:[])])];
}
function planoEvento(e){
  const custos = S.custos.filter(c=>c.evento_id===e.id);
  const custoPrev = custos.length ? custos.reduce((s,c)=>s+Number(c.valor_previsto||0),0) : Number(e.orcamento)||0;
  return { custos, custoPrev, publico: +e.publico_previsto || 0, patroc: Number(e.patrocinio_previsto)||0,
    margem: e.margem_desejada==null ? 0.2 : Number(e.margem_desejada), bar: Number(e.lucro_bar_previsto)||0 };
}
// ingresso + patrocínio pagam os custos com a margem desejada; o bar é lucro extra
function precoIngresso(P, margem){
  const meta = Math.max(0, P.custoPrev/(1-margem) - P.patroc);
  return { meta, preco: P.publico>0 ? Math.ceil(meta/P.publico/5)*5 : 0 };
}
function abrirEvento(id){
  const e = S.eventos.find(x=>x.id===id); if (!e) return;
  const t = S.tarefas.filter(x=>x.evento_id===id).sort((a,b)=>(a.feito-b.feito)||a.id-b.id);
  const movs = S.movimentos.filter(m=>m.evento_id===id && m.valor);
  const ent = movs.filter(m=>m.valor>0).reduce((s,m)=>s+m.valor,0), sai = movs.filter(m=>m.valor<0).reduce((s,m)=>s-m.valor,0);
  const P = planoEvento(e);
  const sug = precoIngresso(P, P.margem);
  const preco = Number(e.preco_ingresso) || sug.preco;
  const bilheteria = preco * P.publico;
  const lucroIng = bilheteria + P.patroc - P.custoPrev;
  const margemReal = bilheteria + P.patroc ? lucroIng/(bilheteria + P.patroc) : 0;
  // gasto por categoria (previsto x realizado)
  const gastoCat = {}; movs.filter(m=>m.valor<0).forEach(m=>{ const k = m.evento_categoria || 'Sem categoria'; gastoCat[k] = (gastoCat[k]||0) - m.valor; });
  const prevCat = {}; P.custos.forEach(c=>{ prevCat[c.categoria] = (prevCat[c.categoria]||0) + Number(c.valor_previsto||0); });
  const cats = [...new Set([...Object.keys(prevCat), ...Object.keys(gastoCat)])];
  const barra = (v, max) => { const pc = max ? Math.min(100, v/max*100) : (v?100:0);
    return `<div style="height:6px;background:var(--line);border-radius:4px;margin-top:6px"><div style="width:${pc}%;height:100%;border-radius:4px;background:${max && v>max ? 'var(--bad)' : 'var(--accent)'}"></div></div>`; };
  const linhaCat = k => { const pv = prevCat[k]||0, g = gastoCat[k]||0; const itens = P.custos.filter(c=>c.categoria===k);
    return `<div style="padding:12px 0;border-top:1px solid var(--line)">
      <div class="row"><b class="grow">${esc(k)}</b><span class="val ${pv && g>pv ? 'neg' : ''}">${brl(g)}</span><span class="muted">&nbsp;/ ${pv ? brl(pv) : 'sem previsão'}</span></div>
      ${barra(g, pv)}
      ${itens.length ? `<div class="muted" style="margin-top:6px">${itens.map(c=>`<button class="lnk" style="padding:2px 0;color:var(--ink2)" onclick="formCusto(${id},${c.id})">${esc(c.descricao || 'previsto')}: ${brl(c.valor_previsto)} ✎</button>`).join('<br>')}</div>` : ''}</div>`; };

  const temPlano = P.publico && P.custoPrev;
  const plano = temPlano ? `
    <div class="card" style="padding:14px">
      <div class="row"><div class="grow"><small class="muted">Preço do ingresso ${Number(e.preco_ingresso) ? 'definido' : 'sugerido'}</small>
        <div style="font-family:var(--slab);font-size:28px;font-weight:700">${brl(preco)}</div></div>
        <div style="text-align:right"><small class="muted">${P.publico.toLocaleString('pt-BR')} ingressos</small><div><b>margem ${Math.round(margemReal*100)}%</b></div></div></div>
      <div style="overflow-x:auto;margin-top:10px"><table style="width:100%;border-collapse:collapse;font-size:14px;text-align:center">
        <tr>${MARGENS.map(x=>`<th style="padding:6px 4px;color:var(--ink3);font-weight:700">${Math.round(x*100)}%</th>`).join('')}</tr>
        <tr>${MARGENS.map(x=>`<td style="padding:6px 4px;border-top:1px solid var(--line);${Math.abs(x-P.margem)<0.001?'font-weight:700;color:var(--accent)':''}">${brl(precoIngresso(P,x).preco)}</td>`).join('')}</tr></table></div>
      <div class="muted" style="margin-top:4px">Preço por margem de lucro (arredondado para cima em R$ 5).</div>
      <div style="margin-top:12px;line-height:1.9">
        <div class="row"><span class="grow">Custos previstos</span><b class="val">${brl(P.custoPrev)}</b></div>
        <div class="row"><span class="grow">Bilheteria prevista</span><b class="val">${brl(bilheteria)}</b></div>
        ${P.patroc ? `<div class="row"><span class="grow">Patrocínio previsto</span><b class="val">${brl(P.patroc)}</b></div>` : ''}
        <div class="row"><span class="grow">Lucro com ingressos</span><b class="val ${lucroIng>=0?'pos':'neg'}">${brl(lucroIng)}</b></div>
        ${P.bar ? `<div class="row"><span class="grow">+ Lucro previsto do bar</span><b class="val pos">${brl(P.bar)}</b></div>
        <div class="row"><span class="grow"><b>Lucro total previsto</b></span><b class="val ${lucroIng+P.bar>=0?'pos':'neg'}">${brl(lucroIng + P.bar)}</b></div>` : ''}
      </div></div>`
    : `<div class="card" style="padding:14px"><p class="muted" style="margin:0">Para o app sugerir o preço do ingresso, informe a quantidade de ingressos (em "Editar evento") e lance os custos previstos abaixo.</p></div>`;

  abrirSheet(`
    <div class="row">${evData(e)}<div class="grow"><h3>${esc(e.nome)}</h3><div class="muted">${esc([e.hora,e.local].filter(Boolean).join(' · '))}</div></div></div>
    ${e.descricao?`<p style="white-space:pre-wrap">${esc(e.descricao)}</p>`:''}
    <div class="sec-h"><h2 style="font-size:18px">Divulgação</h2></div>
    ${cardDivulgacao(e)}
    <div class="kpis" style="margin-top:12px">
      <div class="card kpi"><small>Custo previsto</small><b class="val">${brl(P.custoPrev)}</b></div>
      <div class="card kpi ${P.custoPrev&&sai>P.custoPrev?'bad':''}"><small>Gasto</small><b class="val">${brl(sai)}</b>${P.custoPrev?`<span class="muted">${Math.round(sai/P.custoPrev*100)}% do previsto</span>`:''}</div>
      <div class="card kpi ok"><small>Arrecadado</small><b class="val">${brl(ent)}</b></div>
      <div class="card kpi"><small>Resultado</small><b class="val ${ent-sai>=0?'pos':'neg'}">${brl(ent-sai)}</b></div>
    </div>
    <div class="sec-h"><h2 style="font-size:18px">Planejamento</h2><button class="btn sm ghost" onclick="formEvento(${id})">Editar</button></div>
    ${plano}
    <div class="sec-h"><h2 style="font-size:18px">Previsto x gasto</h2><button class="btn sm ghost" onclick="formCusto(${id})">${IC.plus} Custo previsto</button></div>
    <div class="card" style="padding:2px 14px">${cats.length ? cats.map(linhaCat).join('') : '<div class="empty" style="padding:14px">Lance os custos previstos (estrutura, shows, som…) para acompanhar o gasto de cada um.</div>'}</div>
    <div class="sec-h"><h2 style="font-size:18px">Tarefas</h2><span class="muted">${t.filter(x=>x.feito).length}/${t.length}</span></div>
    <div class="card" style="padding:4px 14px">${t.length ? t.map(x=>`<div class="task ${x.feito?'done':''}"><input type="checkbox" ${x.feito?'checked':''} onchange="tTog(${x.id},this.checked,${id})">
      <div class="grow"><div>${esc(x.descricao)}</div>${x.responsavel||x.prazo?`<div class="muted">${esc([x.responsavel, x.prazo&&('até '+fdata(x.prazo))].filter(Boolean).join(' · '))}</div>`:''}</div>
      <button class="lnk" style="color:var(--ink3);padding:8px" aria-label="Apagar tarefa" onclick="tDel(${x.id},${id})">✕</button></div>`).join('') : '<div class="empty" style="padding:14px">Nenhuma tarefa.</div>'}</div>
    <form class="f" id="fT" style="margin-top:8px"><div class="row"><input name="d" placeholder="Nova tarefa (ex.: contratar som)" required class="grow"><button class="btn sm acc" style="height:46px" aria-label="Adicionar tarefa">${IC.plus}</button></div>
      <div class="g2" style="margin-top:6px"><input name="r" placeholder="Responsável"><input name="p" type="date" title="Prazo"></div></form>
    <div class="sec-h"><h2 style="font-size:18px">Gastos e entradas</h2></div>

    <button class="btn ghost wide" style="margin-bottom:10px" onclick="vincularExtrato(${id})">Vincular lançamentos do extrato</button>
    ${movs.length?`<div class="list">${movs.sort((a,b)=>b.data.localeCompare(a.data)).map(m=>linhaMov(m).replace(`formMov(${m.id})`,`formMov(${m.id},{voltar:${id}})`)).join('')}</div>`:'<p class="muted">Lance gastos com foto do recibo, cole o comprovante do Pix ou vincule lançamentos que já vieram do extrato.</p>'}
    <div class="row" style="margin-top:14px"><button class="btn ghost grow" onclick="formEvento(${id})">Editar evento</button><button class="btn ghost grow" onclick="fecharSheet()">Fechar</button></div>`);
  $('#fT').addEventListener('submit', async ev => { ev.preventDefault(); const f=new FormData(ev.target);
    try { await DB.ins('evento_tarefas',{evento_id:id, descricao:f.get('d').trim(), responsavel:f.get('r').trim()||null, prazo:f.get('p')||null});
      await carregar('evento_tarefas'); abrirEvento(id); } catch(e){ toast(erroMsg(e)); } });

function formCusto(eid, cid){
  const c = cid ? S.custos.find(x=>x.id===cid) : {};

async function excluirCusto(eid, cid){

/* ---------- vincular lançamentos do extrato ao evento ---------- */
function vincularExtrato(eid, tipo='saida', busca=''){
  const e = S.eventos.find(x=>x.id===eid); if (!e) return;
  const ref = new Date(e.data || hojeISO());
  let lst = S.movimentos.filter(m=>!m.evento_id && !m.afiliado_id && (tipo==='saida' ? m.valor<0 : m.valor>0));
  if (busca){ const b = busca.toLowerCase(), bv = num(busca);
    lst = lst.filter(m=>[m.nome,m.descricao,m.obs,m.descricao_publica,m.categoria].join(' ').toLowerCase().includes(b) || (bv && Math.abs(Math.abs(m.valor)-bv)<0.005)); }
  lst = lst.sort((a,b)=>Math.abs(new Date(a.data)-ref)-Math.abs(new Date(b.data)-ref)).slice(0,80);
  const cats = tipo==='saida' ? catsEvento(eid).filter(c=>!CAT_EV_ENT.includes(c)) : CAT_EV_ENT;
  abrirSheet(`<h3>Vincular ao evento</h3>
    <p class="muted">${esc(e.nome)} · aparecem primeiro os lançamentos mais próximos da data do evento.</p>
    <div class="seg" style="margin-bottom:10px"><button class="${tipo==='saida'?'on':''}" onclick="vincularExtrato(${eid},'saida')">Saídas</button><button class="${tipo==='entrada'?'on':''}" onclick="vincularExtrato(${eid},'entrada')">Entradas</button></div>
    <form class="f" id="fBus"><div class="row"><input name="b" class="grow" value="${esc(busca)}" placeholder="Buscar nome, descrição ou valor"><button class="btn sm ghost" style="height:46px">Buscar</button></div></form>
    <form class="f" id="fVin">
      <label>Categoria no evento</label><select name="cat"><option value="">— sem categoria —</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
      <div class="list" style="margin-top:10px">${lst.length ? lst.map(m=>`<label class="li" style="cursor:pointer"><input type="checkbox" name="ids" value="${m.id}" style="width:22px;height:22px;accent-color:var(--accent);flex:none">
        <div class="grow"><div class="t">${esc(m.nome||m.descricao)}</div><div class="s">${fdata(m.data)} · ${esc(m.categoria||'—')}${m.origem==='extrato'?' · extrato':''}</div></div>
        <div class="v val ${m.valor>0?'pos':'neg'}">${brl(m.valor)}</div></label>`).join('') : '<div class="empty" style="padding:14px">Nenhum lançamento sem evento encontrado.</div>'}</div>
      <div class="err" id="vErr"></div>
      <div class="row" style="margin-top:10px"><button type="button" class="btn ghost grow" onclick="abrirEvento(${eid})">Voltar</button><button class="btn acc grow">Vincular selecionados</button></div>
    </form>`);
  $('#fBus').addEventListener('submit', ev => { ev.preventDefault(); vincularExtrato(eid, tipo, new FormData(ev.target).get('b').trim()); });
  $('#fVin').addEventListener('submit', async ev => { ev.preventDefault(); const f = new FormData(ev.target);
    const ids = f.getAll('ids').map(Number); if (!ids.length) return $('#vErr').textContent = 'Marque pelo menos um lançamento.';

/* ---------- ler texto do comprovante de Pix ---------- */
function lerPix(txt){
  const t = String(txt).replace(/\r/g,''); const out = {};
  const v = t.match(/R\$\s*([\d.]+,\d{2})/) || t.match(/valor[^\d\n]{0,25}([\d.]+,\d{2})/i);
  if (v) out.valor = num(v[1]);
  const MES = {jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
  let d = t.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (d) out.data = `${d[3]}-${d[2]}-${d[1]}`;
  else if ((d = t.match(/(\d{1,2})\s*(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?\s*(?:de\s+)?(\d{4})/i)))
    out.data = `${d[3]}-${String(MES[d[2].toLowerCase()]).padStart(2,'0')}-${d[1].padStart(2,'0')}`;
  const linhas = t.split('\n').map(x=>x.trim()).filter(Boolean);
  const kw = /^(para|destino|destinat[aá]rio|recebedor|favorecido|quem recebeu|dados do recebedor|nome do recebedor|pago para|transfer[eê]ncia para)\b\s*:?\s*(.*)$/i;
  for (let i=0; i<linhas.length; i++){ const m = linhas[i].match(kw); if (!m) continue;
    let k = i+1, nome = m[2].replace(/^nome\s*:?\s*/i,'').trim();
    while (!nome && k < linhas.length && k <= i+3){ nome = linhas[k].replace(/^nome\s*:?\s*/i,'').trim(); k++; }
    if (nome && !/R\$|\d{2}\/\d{2}/.test(nome)) out.nome = nome.slice(0,80); break; }
  const id = t.match(/\bE[0-9A-Za-z]{31}\b/); if (id) out.idTx = id[0];
  return out;
}

async function lerArquivo(file){
