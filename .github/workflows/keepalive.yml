name: keepalive
on:
  schedule: [{cron: '17 11 * * *'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (evita pausa do plano grátis)
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" <(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/index.html))
          KEY=$(grep -oP "key:\s*'\K[^']+" <(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/index.html))
          [ -z "$URL" ] && echo "Supabase ainda não configurado" && exit 0
          curl -sf -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
