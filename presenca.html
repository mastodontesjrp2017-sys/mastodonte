<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presença na festa · Mastodonte</title>
<meta name="theme-color" content="#141414">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#161513; --ink2:#4f4a43; --ink3:#6e685d; --line:#e3ddd0;
  --brand:#141414; --brand-ink:#f0eadc; --accent:#b8742a; --accent-soft:#f3e4cf;
  --ok:#2f7a4c; --ok-soft:#e1f0e5; --warn:#9a6f00; --warn-soft:#f8edc8; --bad:#b8352a; --bad-soft:#f8dfdb;
  --r:14px; --slab:"Zilla Slab",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121110; --card:#1c1b19; --ink:#efeae0; --ink2:#c9c2b4; --ink3:#a39c8f; --line:#2e2c28;
  --brand:#0a0a0a; --accent:#d8964b; --accent-soft:#3a2b1a; --ok:#5cbf83; --ok-soft:#173222; --warn:#e2b53c; --warn-soft:#3a3013; --bad:#ec6f62; --bad-soft:#3d1b17;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(12px + env(safe-area-inset-top)) 16px 14px}
.w{max-width:620px;margin:0 auto}
h1{font-family:var(--slab);font-size:21px;margin:0;line-height:1.2}
.count{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.count b{font-family:var(--slab);font-size:34px;line-height:1}
.count span{opacity:.8;font-size:14px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.15);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{margin-top:12px;display:flex;gap:8px}
.tools input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 13px;border-radius:11px;border:0;background:rgba(255,255,255,.12);color:var(--brand-ink)}
.tools input::placeholder{color:rgba(240,234,220,.6)}
.chips{display:flex;gap:6px;margin-top:10px}
.chips button{border:0;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;background:rgba(255,255,255,.1);color:var(--brand-ink);cursor:pointer}
.chips button.on{background:var(--brand-ink);color:var(--brand)}
main{padding:12px 12px calc(110px + env(safe-area-inset-bottom))}
.off{background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.p{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:60px}
.p:first-child{border-top:0}
.p:active{background:var(--accent-soft)}
.box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--ink3);display:grid;place-items:center;font-weight:700;color:#fff}
.p.ok .box{background:var(--ok);border-color:var(--ok)}
.p .n{font-weight:700;line-height:1.25}
.p.ok .n{color:var(--ok)}
.p .s{font-size:13px;color:var(--ink3)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--warn-soft);color:var(--warn);margin-left:4px}
.empty{text-align:center;color:var(--ink3);padding:30px 10px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;min-height:48px}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.wide{width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--card);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sh h2{font-family:var(--slab);margin:0 0 6px;font-size:20px}
.sh input{width:100%;font:inherit;font-size:18px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);margin-top:8px}
.msg{font-size:14px;font-weight:700;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;z-index:30;max-width:92vw}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.hide{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="w">
  <h1 id="tNome">Carregando…</h1>
  <div class="count"><b id="cNum">0</b><span id="cTxt">presentes</span></div>
  <div class="bar"><i id="cBar"></i></div>
  <div class="tools"><input id="q" type="search" placeholder="Buscar nome…" autocomplete="off" aria-label="Buscar nome"></div>
  <div class="chips"><button class="on" data-f="faltam">Faltam</button><button data-f="chegaram">Chegaram</button><button data-f="todos">Todos</button></div>
</div></header>
<main class="w">
  <div class="off hide" id="off">Sem internet: as marcações não estão sendo salvas. Anote no papel e marque depois.</div>
  <div id="lista"></div>
</main>
<div class="foot"><div class="w"><button class="btn ghost wide" id="btAdd">+ Associado que não está na lista</button></div></div>
<script>
const CFG = { url: 'https://cknzysljezvpazonvibb.supabase.co', key: 'sb_publishable_ji48PdmWNR5nvQkXMhbbCQ_DEekbpVL' };
const sb = supabase.createClient(CFG.url, CFG.key);
const $ = s => document.querySelector(s);
const tok = new URLSearchParams(location.search).get('c');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const dig = s => String(s||'').replace(/\D/g,'');
const hora = t => new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
let L = [], F = 'faltam', quem = '';
try { quem = localStorage.getItem('masto_portaria') || ''; } catch(e){}

function toast(txt, desfazer){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(txt)}</span>${desfazer ? '<button>Desfazer</button>' : ''}`;
  if (desfazer) t.querySelector('button').onclick = () => { t.remove(); desfazer(); };
  document.body.appendChild(t); setTimeout(() => t.remove(), 4000);
}
function desenhar(){
  const tot = L.length, pres = L.filter(p => p.presente_em).length;
  $('#cNum').textContent = pres;
  $('#cTxt').textContent = `de ${tot} presentes · faltam ${tot - pres}`;
  $('#cBar').style.width = tot ? (pres/tot*100).toFixed(1) + '%' : '0';
  const q = norm($('#q').value.trim());
  let V = L.filter(p => F === 'todos' || (F === 'faltam' ? !p.presente_em : p.presente_em));
  if (q) V = V.filter(p => norm(p.nome).includes(q));
  if (F === 'chegaram') V = V.slice().sort((a,b) => new Date(b.presente_em) - new Date(a.presente_em));
  $('#lista').innerHTML = V.length ? `<div class="list">${V.map(p => `
    <button class="p ${p.presente_em ? 'ok' : ''}" data-id="${p.id}">
      <span class="box" aria-hidden="true">${p.presente_em ? '✓' : ''}</span>
      <span style="flex:1;min-width:0">
        <span class="n">${esc(p.nome)}${p.origem === 'portaria' ? '<span class="tag">portaria</span>' : ''}</span>
        <span class="s" style="display:block">${p.presente_em ? `chegou às ${hora(p.presente_em)}${p.presente_por ? ' · ' + esc(p.presente_por) : ''}` : (p.cpf_meio ? `CPF ***.${p.cpf_meio}.***-${p.cpf_fim}` : '')}</span>
      </span>
    </button>`).join('')}</div>`
    : `<div class="empty">${q ? 'Ninguém com esse nome nesta lista.<br>Confira em "Todos" ou adicione pelo CPF.' : F === 'faltam' ? 'Todos os confirmados já chegaram. 🎉' : 'Ninguém marcado ainda.'}</div>`;
}
$('#lista').addEventListener('click', ev => { const b = ev.target.closest('.p'); if (b) alternar(+b.dataset.id); });
document.querySelectorAll('.chips button').forEach(b => b.onclick = () => {
  F = b.dataset.f; document.querySelectorAll('.chips button').forEach(x => x.classList.toggle('on', x === b)); desenhar(); });
$('#q').addEventListener('input', desenhar);

async function carregar(){
  if (!tok){ $('#tNome').textContent = 'Link incompleto'; return; }
  const { data, error } = await sb.rpc('presenca_lista', { p_ctoken: tok });
  if (error){ $('#off').classList.remove('hide'); return; }
  if (!data){ $('#tNome').textContent = 'Link inválido'; return; }
  $('#off').classList.add('hide');
  $('#tNome').textContent = data.nome;
  L = data.lista || []; desenhar();
}
async function alternar(id){
  const p = L.find(x => x.id === id); if (!p) return;
  if (!quem){ pedirNome(() => alternar(id)); return; }
  const marcar = !p.presente_em, antes = { em: p.presente_em, por: p.presente_por };
  p.presente_em = marcar ? new Date().toISOString() : null; p.presente_por = marcar ? quem : null; desenhar();
  const { error } = await sb.rpc('presenca_marcar', { p_ctoken: tok, p_id: id, p_presente: marcar, p_quem: quem });
  if (error){ p.presente_em = antes.em; p.presente_por = antes.por; desenhar(); $('#off').classList.remove('hide'); toast('Não salvou. Verifique a internet.'); return; }
  $('#off').classList.add('hide');
  const primeiro = p.nome.split(' ')[0];
  toast(marcar ? `✓ ${primeiro} marcado como presente` : `${primeiro} desmarcado`, () => alternar(id));
  if (marcar && $('#q').value){ $('#q').value = ''; desenhar(); $('#q').focus(); }
}
function sheet(html){ const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="sh">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) o.remove(); }); document.body.appendChild(o); return o; }
function pedirNome(depois){
  const o = sheet(`<h2>Quem está na portaria?</h2><p style="margin:0;color:var(--ink3);font-size:14px">Seu nome fica anotado em cada presença que você marcar.</p>
    <input id="nmP" placeholder="Seu nome" autocomplete="name"><button class="btn wide" style="margin-top:12px" id="okP">Começar</button>`);
  const i = o.querySelector('#nmP'); i.focus();
  o.querySelector('#okP').onclick = () => { const v = i.value.trim(); if (!v) return i.focus();
    quem = v; try { localStorage.setItem('masto_portaria', v); } catch(e){} o.remove(); depois && depois(); };
}
$('#btAdd').onclick = () => {
  if (!quem){ pedirNome(() => $('#btAdd').click()); return; }
  const o = sheet(`<h2>Associado fora da lista</h2><p style="margin:0;color:var(--ink3);font-size:14px">Para quem não confirmou pelo link. Digite o CPF do associado.</p>
    <input id="cpfA" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off"><div class="msg" id="mA"></div>
    <div id="acA"><button class="btn wide" style="margin-top:8px" id="okA">Marcar presença</button></div>`);
  const i = o.querySelector('#cpfA'), m = o.querySelector('#mA'); i.focus();
  i.addEventListener('input', () => { const d = dig(i.value).slice(0,11);
    i.value = d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); });
  const enviar = async forcar => {
    m.style.color = 'var(--ink3)'; m.textContent = 'Conferindo…';
    const { data, error } = await sb.rpc('presenca_adicionar', { p_ctoken: tok, p_cpf: dig(i.value), p_quem: quem, p_forcar: !!forcar });
    if (error){ m.style.color = 'var(--bad)'; m.textContent = (error.message||'Não foi possível.').replace(/^.*?ERROR:\s*/,''); return; }
    if (!data.ok){
      m.style.color = 'var(--bad)'; m.textContent = `${data.nome} está com ${data.atraso} meses de mensalidade em atraso.`;
      o.querySelector('#acA').innerHTML = `<button class="btn bad wide" style="margin-top:8px" id="fA">Liberar mesmo assim (decisão da diretoria)</button>`;
      o.querySelector('#fA').onclick = () => enviar(true); return;
    }
    o.remove(); await carregar(); toast(`✓ ${data.nome.split(' ')[0]} adicionado e marcado como presente`);
  };
  o.querySelector('#okA').onclick = () => enviar(false);
};
carregar();
setInterval(() => { if (!document.hidden) carregar(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregar(); });
</script>
</body>
</html>
